/* =========================================================
   Quiz du film (10 questions, débloqué quand le film est vu)
   ========================================================= */
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const FAMOUS_COMPOSERS = ['Ennio Morricone', 'Dimitri Tiomkin', 'Elmer Bernstein', 'Jerome Moross', 'Max Steiner', 'Bruno Nicolai', 'Luis Bacalov', 'Francesco De Masi', 'Riz Ortolani', 'Jerry Goldsmith', 'Alex North', 'Hugo Friedhofer', 'Victor Young', 'Alfred Newman', 'John Barry', 'Bernard Herrmann', 'Stefano Torossi', 'Gianni Ferrio'];
function quizPools() {
  let QPOOL;
  const dirs = new Map(), roles = [], comps = new Set(FAMOUS_COMPOSERS), locs = new Set(), countries = new Set(), frTitles = [];
  S.films.forEach(g => {
    splitNames(g.director).forEach(d => { if (!dirs.has(d)) dirs.set(d, +g.year || 0); });
    (g.country || '').split(/,\s*/).forEach(c => c && countries.add(c));
    const e = EXT[g.id]; if (e) { (e.mu || []).forEach(c => comps.add(c)); (e.fl || []).concat(e.nl || []).forEach(l => locs.add(l)); }
    if (ENR[g.id] && ENR[g.id].fr) frTitles.push(ENR[g.id].fr);
    const cs = CAST[g.id]; if (cs) cs.forEach(c => { if (c[1] && roles.length < 4000) roles.push(c[1]); });
  });
  QPOOL = {dirs: [...dirs.entries()], roles: [...new Set(roles)], comps: [...comps], locs: [...locs], countries: [...countries], frTitles: [...new Set(frTitles)]};
  return QPOOL;
}
/* Trois mauvaises réponses différentes de la bonne */
function wrong(answer, pool, n) {
  const k = nkey(answer), out = [], seen = new Set([k]);
  for (const x of shuffle(pool)) { const xk = nkey(x); if (!x || seen.has(xk)) continue; seen.add(xk); out.push(x); if (out.length === (n || 3)) break; }
  return out.length === (n || 3) ? out : null;
}
function mkQ(q, answer, others, e) {
  if (!others) return null;
  const c = shuffle([answer].concat(others));
  return {q, c, a: c.indexOf(answer), e: e || ''};
}
function filmsNearYear(f, span, filter) {
  const y = +f.year || 1960;
  return S.films.filter(g => g.id !== f.id && Math.abs((+g.year || 0) - y) <= span && (!filter || filter(g)));
}
function buildFilmQuiz(f) {
  const P = quizPools(), t = tTitle(f), y = +f.year || 0, cast = castOf(f), e = EXT[f.id] || {};
  const out = [];
  const add = (x) => { if (x) out.push(x); };
  // Personnages et interprètes
  const withRole = cast.filter(c => c.role).slice(0, 8);
  shuffle(withRole).slice(0, 3).forEach(c => {
    const others = cast.filter(o => o.name !== c.name).map(o => o.name);
    const pool = others.length >= 3 ? others : others.concat(filmsNearYear(f, 8).flatMap(g => castOf(g).slice(0, 2).map(o => o.name)));
    add(mkQ(`Qui joue le personnage de ${c.role} ?`, c.name, wrong(c.name, pool.slice(0, 200)), `${c.name} interprète ${c.role}.`));
  });
  if (withRole.length >= 4) {
    const c = withRole[Math.floor(Math.random() * withRole.length)];
    add(mkQ(`Quel personnage joue ${c.name} ?`, c.role, wrong(c.role, withRole.filter(o => o !== c).map(o => o.role)), `${c.name} joue ${c.role}.`));
  } else if (withRole.length) {
    const c = withRole[0];
    add(mkQ(`Quel personnage joue ${c.name} ?`, c.role, wrong(c.role, P.roles), `${c.name} joue ${c.role}.`));
  }
  if (y) {
    const ys = shuffle([-12, -9, -7, -5, -4, -3, -2, 2, 3, 4, 5, 7, 9, 12]).map(d => String(y + d)).filter(v => +v >= 1895 && +v <= new Date().getFullYear());
    add(mkQ(`En quelle année ${isTV(f) ? 'la série a-t-elle commencé' : 'est sorti ce film'} ?`, String(y), wrong(String(y), ys), `${t} date de ${y}.`));
  }
  const dirs = splitNames(f.director);
  if (dirs.length) {
    const near = P.dirs.filter(([d, yy]) => !dirs.includes(d) && (!y || Math.abs(yy - y) <= 15)).map(([d]) => d);
    add(mkQ(`Qui a réalisé ${isTV(f) ? 'cette série' : 'ce film'} ?`, dirs[0], wrong(dirs[0], near.length >= 3 ? near : P.dirs.map(x => x[0])), `Réalisation : ${dirs.join(', ')}.`));
  }
  if ((e.mu || []).length) add(mkQ('Qui a composé la musique ?', e.mu[0], wrong(e.mu[0], P.comps.filter(c => !e.mu.includes(c))), `La musique est de ${e.mu.join(', ')}.`));
  if (cast.length >= 3) {

Règle absolue : n'invente rien. Utilise seulement des faits dont tu es certain ou qui figurent dans les données ci-dessous. Si tu connais mal ce titre, fais des questions uniquement à partir des données (résumé, personnages, distribution, musique, lieux).

const supportFromText = (t) => /4k|uhd/i.test(t) ? '4K UHD' : /blu.?ray/i.test(t) ? 'Blu-ray' : /dvd/i.test(t) ? 'DVD' : /vhs/i.test(t) ? 'VHS' : '';
function scanCandidates(text) {
  const clean = String(text || '').replace(/\[[^\]]*\]|\([^)]*\)/g, ' ').replace(/\b(blu-?ray|dvd|4k|uhd|ultra hd|vhs|édition|edition|collector|coffret|steelbook|widescreen|special|import|region \d|zone \d|import|version restaurée|digibook|combo)\b/gi, ' ');
  const words = norm(clean).split(/\s+/).filter(w => w.length > 2);
  if (!words.length) return [];
  const yr = (String(text).match(/\b(19[0-9]{2}|20[0-2][0-9])\b/) || [])[1];
  return S.films.map(f => {
    const t = norm(tTitle(f) + ' ' + f.title + ' ' + (f.originalTitle || ''));
    const hit = words.filter(w => t.includes(w)).length;
    let s = hit / words.length;
    if (yr && f.year === yr) s += 0.3;
    if (f.owned) s -= 0.05;
    return [f, s];
  }).filter(x => x[1] >= 0.5).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
}
async function scanCode(code) {
  code = String(code || '').replace(/\D/g, '');

  const known = eanIndex().get(code);
  if (known) {
    known.owned = true; save();
    SCAN.log.unshift({id: known.id, code}); SCAN.cand = null; toast('« ' + tTitle(known) + ' » est déjà dans ta collection'); render(); return;
  }
  SCAN.code = code; SCAN.product = ''; SCAN.q = ''; SCAN.cand = []; SCAN.busy = true; render();
  if (IS_DESKTOP) {
    try {
      const d = await window.cwDesktop.fetchJson('https://api.upcitemdb.com/prod/trial/lookup?upc=' + code);
      const it = d && d.items && d.items[0];
      if (it && it.title) { SCAN.product = it.title; SCAN.support = supportFromText(it.title + ' ' + (it.category || '')); SCAN.cand = scanCandidates(it.title); }
    } catch (e) { /* base hors ligne : recherche manuelle */ }
  }

  setTimeout(() => $('#scan-q') && $('#scan-q').focus(), 0);
}
function scanAttach(f) {

/* Décodage d'images (photo ou caméra) avec la bibliothèque ZXing */
function zxing() { return window.ZXing || null; }
async function decodePhoto(file) {
  const Z = zxing(); if (!Z) throw new Error('Le lecteur de codes-barres n\'est pas disponible (connexion Internet nécessaire la première fois).');
  const url = URL.createObjectURL(file);
  try {
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints);
    const res = await reader.decodeFromImageUrl(url);
    return res.getText();
  } catch (e) { throw new Error('Aucun code-barres lisible sur la photo. Cadre bien le code, sans reflet.'); }
  finally { URL.revokeObjectURL(url); }
}

   - avec la page Claude : l'application ouvre la page en arrière-plan et échange les données

const SYNC_FILE = 'CineWestern-synchro.json';
const DEFAULT_PAGE_URL = '';   // chacun colle l'adresse de sa propre page Claude (Réglages › Synchronisation)
const SY = {folder: '', folderAt: 0, folderErr: '', pageOn: false, pageUrl: DEFAULT_PAGE_URL, pageAt: 0, pageErr: '', busy: false, thumbs: true};

}

/* Fusionne des données reçues ; renvoie true si quelque chose a changé ici */
function mergePayload(p) {
  if (!p || typeof p !== 'object' || !p.over) return false;
  computeOver();   // date d'abord nos propres modifications en attente
  let changed = false;
  const rdel = p.del || {};
  Object.keys(p.over).forEach(id => {
    const rf = p.over[id], rt = rf.upd || 0;
    const lf = byId(id);
    if (lf) {

  });
  Object.keys(rldel).forEach(id => {
    const l = S.lists.find(x => x.id === id);
    if (l && (l.upd || 0) < rldel[id]) { S.lists = S.lists.filter(x => x.id !== id); PREVL.delete(id); changed = true; }

}

    case 'qz-again': if (QUIZ) { const k = QUIZ; if (k.kind === 'music') startMusicQuiz(k.src); else startQuiz(k.kind, byId(k.id)); } break;
    case 'close': case 'close-overlay': closeEditor(); break;
    case 'search': UI.q = el.dataset.v; $('#q').value = el.dataset.v; UI.decades.clear(); UI.subs.clear(); UI.types.clear(); UI.themes.clear(); UI.family = false; UI.maxRt = 0; UI.limit = PAGE; UI.hideSeen = UI.ownedOnly = UI.toWatch = UI.freeOnly = false; location.hash = '#/catalogue'; if (route().name === 'catalogue') render(); break;
    case 'star': if (f) { const n = +el.dataset.v; f.myNote = f.myNote === n ? 0 : n; save(); render(); } break;
    case 'status': if (f) {
      const s = el.dataset.v;
      if (s === 'vu' && f.status !== 'vu' && !(f.views || []).length) { openViewDialog(f); break; }
      f.status = f.status === s ? '' : s; if (f.status === 'vu' && !f.watchedDate) f.watchedDate = today(); save(); render();
    } break;
    case 'owned': if (f) { f.owned = !f.owned; if (!f.owned && f.loan) { f.loanHist.push(Object.assign({}, f.loan, {back: today()})); f.loan = null; } save(); render(); } break;
    case 'family': if (f) { f.family = el.dataset.v; save(); render(); } break;
    case 'theme': UI.themes.clear(); UI.themes.add(el.dataset.v); UI.q = ''; $('#q').value = ''; UI.limit = PAGE; location.hash = '#/catalogue'; if (route().name === 'catalogue') render(); break;
    case 'view-add': if (f) openViewDialog(f); break;
    case 'view-edit': if (f) openViewDialog(f, +el.dataset.i); break;
    case 'view-del': {
      const g = viewEdit && byId(viewEdit.id); if (!g) break;
      g.views.splice(viewEdit.i, 1); g.watchedDate = lastView(g); if (!g.views.length && g.status === 'vu') g.watchedDate = '';
      save(); closeEditor(); toast('Séance supprimée'); render(); break;
    }
    case 'v-star': { const n = +el.dataset.v, inp = $('#v-n'); inp.value = +inp.value === n ? 0 : n; document.querySelectorAll('[data-act="v-star"]').forEach(b => { b.innerHTML = starSvg(+b.dataset.v <= +inp.value); }); break; }
    case 'loan-back': if (f && f.loan) { f.loanHist.push(Object.assign({}, f.loan, {back: today()})); f.loan = null; save(); toast('Retour enregistré'); render(); } break;
    case 'eps-load': if (f) {
      el.disabled = true; el.innerHTML = '<span class="spin"></span> Chargement…';
      try { const E = await loadEpisodes(f); toast(E.eps.length + ' épisodes chargés'); } catch (e) { toast(e.message); }
      render();
    } break;
    case 'eps-season': if (f && EPS[f.id]) {
      const sn = +el.dataset.s, on = el.dataset.v === '1', ids = EPS[f.id].eps.filter(e => e[1] === sn).map(e => e[0]);
      const set = new Set(f.epSeen || []); ids.forEach(i => on ? set.add(i) : set.delete(i)); f.epSeen = [...set];
      epsDone(f); save(); render();
    } break;
    case 'person-tab': UI.personAll = el.dataset.v; render(); break;
    case 'cs-again': csDraw(); render(); break;
    case 'cs-watch': { const g = byId(CS.pick); if (g) { location.hash = '#/film/' + g.id; setTimeout(() => openViewDialog(g), 50); } break; }
    case 'alerts-clear': try { localStorage.setItem('cw-alerts', '[]'); } catch (e) { /* rien */ } paintAlertBadge(); render(); break;
    case 'saga-avoir': { const name = SAGA_ORDER[+el.dataset.v]; sagaFilms(name).forEach(g => { if (!g.status) g.status = 'avoir'; }); save(); toast('Saga ajoutée à « à voir »'); render(); break; }
    case 'scan-pick': { const g = byId(el.dataset.id); if (g) scanAttach(g); break; }
    case 'scan-cancel': SCAN.cand = null; render(); setTimeout(() => $('#scan-code') && $('#scan-code').focus(), 0); break;
    case 'scan-new': {
      const g = blankFilm(); g.title = SCAN.product ? SCAN.product.replace(/\[[^\]]*\]|\([^)]*\)/g, '').replace(/\b(blu-?ray|dvd|4k|uhd)\b/gi, '').trim() : 'Nouveau titre';
      S.films.push(g); scanAttach(g); location.hash = '#/film/' + g.id; setTimeout(() => openEditor(g.id), 50); break;
    }
    case 'cam-start': camStart(); break;
    case 'cam-stop': camStop(); break;
    case 'sync-folder': {
      const dir = await window.cwDesktop.chooseFolder(); if (!dir) break;
      SY.folder = dir; SY.folderErr = ''; saveSyncPrefs(); toast('Dossier de synchronisation choisi'); render(); syncAll(); break;
    }
    case 'sync-folder-off': SY.folder = ''; saveSyncPrefs(); render(); break;
    case 'page-show': window.cwDesktop.pageShow(SY.pageUrl); break;
    case 'page-off': SY.pageOn = false; SY.pageErr = ''; saveSyncPrefs(); render(); break;
    case 'sync-now': syncAll(); break;
    case 'tr-all': if (!TR.active) translateAll(); break;
    case 'tr-stop': TR.stop = true; break;
    case 'translate': {
      el.disabled = true; el.innerHTML = '<span class="spin"></span> Traduction…';
      try { const n = await translateIds([el.dataset.id]); toast(n ? 'Résumé traduit' : 'La traduction n\'a rien donné'); }
      catch (e) { toast(e && e.code === 'not_granted' ? 'Traduction refusée sur cette page.' : 'Traduction impossible pour le moment.'); }
      render(); break;
    }
    case 'enrich-retry': Object.keys(ENR).forEach(k => { if (ENR[k] && ENR[k].x) delete ENR[k]; }); Object.keys(CAST).forEach(k => { if (!CAST[k].length) delete CAST[k]; }); saveCaches(); toast('Recherche relancée'); Object.keys(EXT).forEach(k => { if (!Object.keys(EXT[k]).length) delete EXT[k]; }); runEnrich().then(runCast).then(runExtras); break;
    case 'delete': {
      const film = byId(el.dataset.id); if (!film) break;
      if (!(await ask('Supprimer « ' + tTitle(film) + ' » de ta base ? Ta note et tes remarques sur ce film seront effacées.', 'Supprimer'))) break;
      S.films = S.films.filter(x => x.id !== film.id); S.lists.forEach(l => { l.ids = l.ids.filter(i => i !== film.id); });
      save(); toast('« ' + tTitle(film) + ' » supprimé'); location.hash = '#/catalogue'; break;
    }
    case 'complete': {
      const film = byId(el.dataset.id); if (!film) break;
      el.disabled = true; el.innerHTML = '<span class="spin"></span> Recherche sur TMDB…';
      try { await completeFromTmdb(film); toast('Fiche complétée avec TMDB'); }
      catch (e) { toast(e.message); }
      render(); break;
    }
    case 'ex-open': case 'ex-add': {
      const id = +el.dataset.id; el.disabled = true;
      try {
        const film = await importTmdb(id, EX.kind);
        if (act === 'ex-open') location.hash = '#/film/' + film.id;
        else { toast('« ' + film.title + ' » ajouté à ta base'); paintEx(); }
      } catch (e) { toast(e.message); el.disabled = false; }
      break;
    }
    case 'ex-page': EX.page = Math.max(1, Math.min(EX.pages, EX.page + +el.dataset.d)); exLoad(); window.scrollTo(0, 0); break;
    case 'coltab': UI.colTab = el.dataset.v; render(); break;
    case 'open': location.hash = '#/film/' + el.dataset.id; break;
    case 'csv': exportCsv(el.dataset.all === '1'); break;
    case 'rename-list': {
      const l = S.lists.find(x => x.id === route().id); if (!l) break;
      $('#rename-zone').innerHTML = `<form id="renameform" class="row" style="align-items:flex-end"><label class="field" style="flex:1 1 260px"><span>Nouveau nom</span><input class="inp" id="rename-name" value="${h(l.name)}" maxlength="60"></label><button class="btn primary" type="submit">Enregistrer</button></form>`;
      $('#rename-name').focus(); $('#rename-name').select(); break;
    }
    case 'del-list': {
      const l = S.lists.find(x => x.id === route().id); if (!l) break;
      if (!(await ask('Supprimer la liste « ' + l.name + ' » ? Les films restent dans ta base.', 'Supprimer la liste'))) break;
      S.lists = S.lists.filter(x => x.id !== l.id); save(); toast('Liste supprimée'); location.hash = '#/listes'; break;
    }
    case 'rm-from-list': { const l = S.lists.find(x => x.id === route().id); if (l) { l.ids = l.ids.filter(i => i !== el.dataset.id); save(); render(); } break; }
    case 'del-key': S.tmdbKey = ''; EX.loaded = false; save(); render(); toast('Clé TMDB retirée'); break;
    case 'backup': {
      const {over, del} = computeOver();
      const data = {app: 'Ciné Western', v: 3, date: today(), over, del, lists: S.lists, ldel: LDEL, images: IMAGES, caches: cachePayload()};
      if (!IS_WEB) data.posters = POSTERS;
      if (!IS_WEB && S.tmdbKey) data.tmdbKey = S.tmdbKey;
      if (await download('cine-western-sauvegarde-' + today() + '.json', JSON.stringify(data, null, 1), 'application/json')) toast('Sauvegarde téléchargée');
      break;
    }
    case 'reset': {
      if (!(await ask('Tout remettre à zéro ? Ta collection, tes listes, tes modifications et les titres ajoutés seront effacés. Pense à exporter une sauvegarde avant.', 'Tout effacer'))) break;
      const key = S.tmdbKey; const keepDel = DEL; S = initialState(); DEL = keepDel; S.tmdbKey = key; HAY.clear(); save(); toast('Base remise à zéro'); location.hash = '#/catalogue'; render(); break;
    }
  }
});

/* =========================================================
   Saisies (champs, cases, formulaires)
   ========================================================= */
let notesTimer, qTimer;
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') {
    UI.q = t.value; UI.limit = PAGE;
    if (route().name !== 'catalogue') location.hash = '#/catalogue';
    else { clearTimeout(qTimer); qTimer = setTimeout(paintCatGrid, 150); }
  } else if (t.dataset.ch === 'notes') {
    const f = currentFilm(); if (!f) return;
    f.notes = t.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 400);
  } else if (t.id === 'ex-vote') {
    $('#ex-vote-v').textContent = +t.value ? fmtNote(+t.value) : 'aucune';
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'qz-src') { QZSRC = ev.target.value; render(); return; }
  const t = ev.target, ch = t.dataset.ch, f = currentFilm();
  if (ch === 'sub') { t.checked ? UI.subs.add(t.value) : UI.subs.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'type') { t.checked ? UI.types.add(t.value) : UI.types.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'flag') { UI[t.dataset.k] = t.checked; UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'sort') { UI.sort = t.value; UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'theme') { t.checked ? UI.themes.add(t.value) : UI.themes.delete(t.value); UI.limit = PAGE; paintCatGrid(); }
  else if (ch === 'maxrt') { UI.maxRt = +t.value; UI.limit = PAGE; render(); }
  else if (ch === 'ep' && f) {
    const id = +t.value, set = new Set(f.epSeen || []); t.checked ? set.add(id) : set.delete(id); f.epSeen = [...set];
    const done = epsDone(f); save(); if (done) render(); else { const z = t.closest('details'); if (z) { const E = EPS[f.id]; const sn = E.eps.find(e => e[0] === id)[1]; const eps = E.eps.filter(e => e[1] === sn); z.querySelector('summary .muted').textContent = '· ' + eps.filter(e => set.has(e[0])).length + '/' + eps.length; } }
  }
  else if (ch === 'cs') { CS.src = $('#cs-src').value; CS.type = $('#cs-type').value; CS.maxRt = +$('#cs-rt').value; CS.family = $('#cs-family').checked; CS.unseen = $('#cs-unseen').checked; CS.pick = undefined; render(); }
  else if (ch === 'jr') { JR.year = t.value; render(); }
  else if (ch === 'goal') { try { localStorage.setItem('cw-goal', String(Math.max(1, +t.value || 52))); } catch (e) { /* rien */ } render(); }
  else if (t.id === 'sync-thumbs') { SY.thumbs = t.checked; saveSyncPrefs(); }
  else if (t.id === 'scan-photo' && t.files && t.files[0]) {
    const file = t.files[0]; t.value = '';
    decodePhoto(file).then(code => scanCode(code)).catch(e => toast(e.message));
  }
  else if (ch === 'support' && f) { f.support = t.value; save(); }
  else if (ch === 'watched' && f) { f.watchedDate = t.value; save(); }
  else if (ch === 'inlist' && f) {
    const l = S.lists.find(x => x.id === t.value); if (!l) return;
    if (t.checked) { if (!l.ids.includes(f.id)) l.ids.push(f.id); } else l.ids = l.ids.filter(i => i !== f.id);
    save(); toast(t.checked ? 'Ajouté à « ' + l.name + ' »' : 'Retiré de « ' + l.name + ' »');
  } else if (t.id === 'run-free') {
    RUN.checkFree = t.checked; if (!RUN.active) openPosterPanel();
  } else if (t.id === 'own-img' && t.files && t.files[0] && f) {
    const file = t.files[0]; t.value = '';
    setOwnImage(f, file).then(() => { toast('Photo ajoutée'); render(); }).catch(e => toast(e.message || 'Impossible d\'enregistrer la photo.'));
  } else if (t.id === 'restore-file' && t.files && t.files[0]) {
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const data = JSON.parse(rd.result);
        const st = stateFrom(data);
        if (!st) throw new Error();
        const nMod = data.over ? Object.keys(data.over).length : data.films.length;
        if (!(await ask('Remplacer ta collection actuelle par cette sauvegarde (' + nMod + ' fiche' + (nMod > 1 ? 's' : '') + ' avec tes notes ou modifications, ' + st.lists.length + ' liste' + (st.lists.length > 1 ? 's' : '') + ') ?', 'Remplacer'))) return;
        const key = S.tmdbKey;
        st.tmdbKey = IS_WEB ? '' : (st.tmdbKey || key);
        delete st._over; S = st; HAY.clear(); save(); EX.loaded = false;
        if (data.caches) { mergeCaches(data.caches); saveCaches(); }
        if (data.posters && typeof data.posters === 'object' && !IS_WEB) { POSTERS = Object.assign({}, POSTERS, data.posters); savePosters(); }
        if (data.thumbs && typeof data.thumbs === 'object' && MODE === 'db') {  // affiches pour la page
          const clean = {}; Object.entries(data.thumbs).forEach(([id, t]) => { if (typeof t === 'string' && t.startsWith('data:image/')) clean[id] = t; });
          toast('Enregistrement des affiches sur la page…');
          try { const n = await thumbStore.saveAll(clean); Object.assign(THUMBS, clean); toast(n.toLocaleString('fr-FR') + ' affiches enregistrées sur la page'); }
          catch (e) { toast('Les affiches n\'ont pas pu être enregistrées : ' + (e.message || e.code)); }
        }
        if (data.images && typeof data.images === 'object') {
          for (const [id, img] of Object.entries(data.images)) {
            if (typeof img === 'string' && img.startsWith('data:image/')) { try { await imgStore.put(id, img); IMAGES[id] = img; } catch (e) { /* on continue */ } }
          }
        }
        toast('Sauvegarde restaurée'); render();
      } catch (e) { toast("Ce fichier n'est pas une sauvegarde Ciné Western valide."); }
    };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('submit', async (ev) => {
  const t = ev.target; ev.preventDefault();
  if (t.id === 'ed-form') saveEditor();
  else if (t.id === 'viewform') saveViewDialog();
  else if (t.id === 'loanform') {
    const f = currentFilm(); const to = $('#loan-to').value.trim();
    if (!f || !to) { $('#loan-to').focus(); return; }
    f.loan = {to, d: $('#loan-d').value || today()}; save(); toast('Prêt enregistré'); render();
  }
  else if (t.id === 'csform') { csDraw(); render(); }
  else if (t.id === 'scanform') { const v = $('#scan-code').value; $('#scan-code').value = ''; scanCode(v); }
  else if (t.id === 'scan-search') {
    SCAN.q = $('#scan-q').value.trim(); const w = norm(SCAN.q).split(/\s+/).filter(Boolean);
    SCAN.cand = w.length ? S.films.filter(g => w.every(x => hayOf(g).includes(x))).slice(0, 12) : []; render();
  }
  else if (t.id === 'pageform') {
    const u = $('#page-url').value.trim();
    if (!/^https:\/\/claude\.ai\//.test(u)) { toast('L\'adresse doit commencer par https://claude.ai/'); return; }
    SY.pageUrl = u; SY.pageOn = true; SY.pageErr = ''; saveSyncPrefs(); toast('Page reliée : synchronisation en cours'); render(); syncAll();
  }
  else if (t.id === 'ex-form') {
    EX.kind = $('#ex-kind').value; EX.q = $('#ex-q').value; EX.dec = $('#ex-dec').value; EX.sort = $('#ex-sort').value; EX.vote = +$('#ex-vote').value; EX.only = $('#ex-only').checked; EX.page = 1;
    exLoad();
  } else if (t.id === 'newlist') {
    const name = $('#newlist-name').value.trim(); if (!name) { $('#newlist-name').focus(); return; }
    const l = {id: uid(), name, ids: []}; S.lists.push(l); save(); toast('Liste « ' + name + ' » créée'); location.hash = '#/listes/' + l.id;
  } else if (t.id === 'renameform') {
    const l = S.lists.find(x => x.id === route().id); const name = $('#rename-name').value.trim();
    if (l && name) { l.name = name; save(); render(); toast('Liste renommée'); }
  } else if (t.id === 'keyform') {
    const key = $('#tmdbkey').value.trim(), msg = $('#keymsg');
    if (!key) { msg.textContent = 'Colle d\'abord ta clé dans le champ.'; return; }
    const old = S.tmdbKey; S.tmdbKey = key; msg.innerHTML = '<span class="spin"></span> Test de la clé…';
    try { await tmdb('/configuration'); EX.loaded = false; save(); render(); toast('Clé TMDB enregistrée : tous les westerns sont disponibles'); }
    catch (e) { S.tmdbKey = old; msg.textContent = e.message; }
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeEditor(); });

document.addEventListener('error', (ev) => {
  const t = ev.target; if (!t || t.tagName !== 'IMG') return;
  if (t.dataset.title) { const sp = document.createElement('span'); sp.className = 'poster-title'; sp.textContent = t.dataset.title; t.replaceWith(sp); }
  else t.remove();
}, true);
boot();
</script>
