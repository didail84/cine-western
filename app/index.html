<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ciné Western</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ambiance saloon : fond brun nuit, sable, rouille. En-tête fixe, filtres à gauche, contenu fluide. */
:root{
  --bg:#17130F; --surface:#1F1A15; --raised:#2B231B; --line:#3A3128; --line2:#4A3F33;
  --fg:#EDE3D1; --soft:#D8C7AC; --muted:#B5A68F; --dim:#9C8E7A;
  --accent:#D9773A; --accent-soft:#F5C08F; --accent-deep:#3A2A1C;
  --good:#2F5D4A; --good-fg:#E9F5EE; --wait:#4A3524; --danger:#A8432E;
  --display:'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
  --body:'Work Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
a{color:var(--accent-soft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}
.label{margin:0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand span{font-family:var(--display);font-weight:700;font-size:24px}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main a{padding:10px 14px;border-radius:6px;color:var(--fg);text-decoration:none}
nav.main a:hover{background:var(--raised)}
nav.main a.on{background:var(--accent-deep);color:var(--accent-soft);font-weight:600}
.search{flex:1 1 280px;display:flex;justify-content:flex-end}
.search label{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.search input::placeholder,input::placeholder,textarea::placeholder{color:var(--dim)}

.wrap{padding:24px;max-width:1500px;margin:0 auto}
.layout{display:flex;flex-wrap:wrap;gap:32px}
.filters{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:24px}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.fgroup{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.check{display:flex;align-items:center;gap:10px;min-height:32px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.check .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1.title{margin:0;font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.head-row p{margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:8px;background:transparent;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent);background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-fg);font-weight:600}
.btn.wait{background:var(--wait);border-color:var(--wait);color:var(--accent-soft);font-weight:600}
.btn.danger{border-color:var(--danger);color:#F2B8A8}
.btn.danger:hover{background:var(--danger);color:var(--fg)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
select.sel,input.inp,textarea.inp{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
input.inp{width:100%}
label.inline{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border:0;background:transparent;cursor:pointer;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--soft);text-decoration:none}
.tab.on{color:var(--accent-soft);font-weight:600;border-bottom-color:var(--accent)}

/* Grille d'affiches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:6px;color:var(--fg);text-decoration:none;min-width:0}
.poster{position:relative;display:flex;align-items:flex-end;aspect-ratio:2/3;max-width:100%;border-radius:8px;padding:12px;border:1px solid var(--line2);overflow:hidden;width:100%}
button.poster{cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover .poster,button.poster:hover{border-color:var(--accent)}
.poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster-title{position:relative;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;color:#F6EEDF}
.pill{position:absolute;z-index:1;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.3px}
.pill.note{top:8px;right:8px;background:var(--bg);color:var(--accent-soft)}
.pill.vu{top:8px;left:8px;background:var(--good);color:var(--good-fg)}
.pill.avoir{top:8px;left:8px;background:var(--wait);color:var(--accent-soft)}
.pill.own{bottom:8px;right:8px;background:var(--bg);color:var(--soft)}
.pill.free{bottom:8px;left:8px;background:var(--good);color:var(--good-fg)}
.watch{display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.watch .badge{align-self:flex-start}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-soft);text-decoration:underline;cursor:pointer;font:inherit}
.card-t{font-weight:600;line-height:1.25}
.card-m{color:var(--muted);font-size:13px}
.empty{padding:40px 24px;border:1px dashed var(--line2);border-radius:10px;text-align:center;color:var(--soft)}
.empty h2{margin:0 0 6px;font-family:var(--display);font-size:22px;color:var(--fg)}

/* Fiche */
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none}
.film{display:flex;flex-wrap:wrap;gap:36px}
.film-side{flex:0 1 300px;display:flex;flex-direction:column;gap:12px;min-width:0}
.film-main{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:20px}
.film-main h1{margin:0;font-family:var(--display);font-size:42px;line-height:1.05}
.film-main .orig{margin:6px 0 0;color:var(--muted);font-style:italic}
.film-main .meta{margin:8px 0 0;color:var(--soft)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border-radius:16px;background:var(--raised);border:1px solid var(--line2);font-size:13px}
.panel{display:flex;flex-wrap:wrap;gap:28px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.bignum{font-family:var(--display);font-size:30px;font-weight:700;color:var(--accent-soft);font-variant-numeric:tabular-nums}
.bignum small{font-size:16px;color:var(--muted)}
.stars{display:flex;gap:2px}
.star{width:40px;height:40px;border:0;background:transparent;padding:0;cursor:pointer}
.box-l.media{gap:22px}
.media-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.media .yt,.media .ytcover{max-width:720px}
.nbadge[hidden]{display:none}
.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tracks li{display:flex;align-items:center;gap:10px;min-width:0}
.tracks li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.btn.play{min-width:108px}
.btn.play.on{background:var(--accent);color:#1A120B;border-color:var(--accent)}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytcover{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line2);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ytcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
.ytplay{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1A120B;font-weight:600;padding:12px 18px;border-radius:999px}
.ytcover:hover .ytplay,.ytcover:focus-visible .ytplay{background:var(--accent-soft)}
.ytcover:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quizbox.locked{opacity:.85}
.lock{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--accent-soft)}
.modal.quiz{display:flex;flex-direction:column;gap:14px}
.qz-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qz-q{font-size:20px;line-height:1.4;margin:4px 0 0;font-weight:600}
.qz-choices{display:flex;flex-direction:column;gap:8px}
.qz-c{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);color:var(--fg);font:inherit;font-size:16px;cursor:pointer}
.qz-c:hover:not([disabled]){border-color:var(--accent)}
.qz-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qz-c[disabled]{cursor:default}
.qz-c.ok{background:var(--good);border-color:#5FA383;color:#F1FBF5}
.qz-c.ko{background:#5A2620;border-color:#C2614F;color:#FBE9E4}
.qz-c.dim{opacity:.55}
.qz-l{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--line2);font-size:13px;font-weight:700}
.qz-e{margin:0;line-height:1.5;color:var(--soft)}
.qz-end{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;text-align:center}
.qz-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qz-list li{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qz-score{font-weight:600;color:var(--accent-soft);min-width:56px;text-align:right}
@media (max-width:560px){.qz-list li{grid-template-columns:1fr auto auto}.qz-list li>.muted{display:none}}
.cast{display:flex;flex-wrap:wrap;gap:10px}
.more-cast summary{cursor:pointer;color:var(--accent-soft);font-weight:600;margin:2px 0 10px;min-height:32px;display:flex;align-items:center}
.more-cast summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.person{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 6px;border-radius:24px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;cursor:pointer}
.person:hover{border-color:var(--accent)}
.ini.f{background:#4A3040;color:#F4C9D6}
.ini{width:34px;height:34px;border-radius:50%;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent-soft);flex:none}
.person b{display:block;font-size:14px}
.person i{display:block;font-style:normal;color:var(--muted);font-size:12px}
.two{display:flex;flex-wrap:wrap;gap:24px}
.two > *{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.synopsis{margin:0;line-height:1.6;color:var(--soft);max-width:70ch}
.lbl-note{text-transform:none;letter-spacing:0;font-weight:400}

/* Tableaux & stats */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:720px;border-collapse:collapse}
th{padding:12px 16px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;background:var(--surface)}
td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface)}
.thumb{width:36px;height:54px;border-radius:4px;flex:none;object-fit:cover;border:1px solid var(--line2)}
.cellfilm{display:flex;align-items:center;gap:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:13px;font-weight:600}
.badge.vu{background:var(--good);color:var(--good-fg)}
.badge.avoir{background:var(--wait);color:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tile .bignum{font-size:32px}
.tile small{color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;font-size:14px}
.bar .track{height:14px;border-radius:7px;background:var(--raised);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.box{padding:20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{margin:0;font-family:var(--display);font-size:22px}

/* Listes */
.listnav{flex:1 1 240px;max-width:300px;display:flex;flex-direction:column;gap:8px}
.listlink{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:0 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.listlink:hover{border-color:var(--accent)}
.listlink.on{border-color:var(--accent);background:var(--accent-deep)}
.listlink span:last-child{color:var(--muted);font-size:13px}

/* Fenêtre d'édition */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.75);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.modal h2{margin:0;font-family:var(--display);font-size:26px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:13px;color:var(--muted);font-weight:500}
.field .hint{font-size:12px;color:var(--dim)}
.err{color:#F2B8A8;font-size:14px;min-height:1em}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:8px;background:var(--raised);border:1px solid var(--accent);color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.warn{padding:12px 16px;border-radius:8px;background:var(--wait);color:var(--accent-soft);margin-bottom:16px}
.note-box{padding:16px 18px;border-radius:10px;background:var(--surface);border:1px solid var(--line);line-height:1.6}
.note-box ol{margin:8px 0 0;padding-left:20px}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:8px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.box-l{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.box-l .label{margin:0}
.saga{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.saga li.cur a{color:var(--fg);font-weight:600;text-decoration:none}
.views{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.eps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.eps .check{min-height:30px;font-size:14px}
.season summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:8px;font-weight:600}
.badge.late{background:var(--danger);color:var(--fg)}
.tagbtn{cursor:pointer;color:var(--fg);font:inherit;font-size:13px}
.tagbtn:hover{border-color:var(--accent)}
.small-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.pick{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:24px;align-items:start}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.journal li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.jthumb{width:40px;height:60px;border-radius:4px;flex:none;overflow:hidden;display:block;border:1px solid var(--line2)}
.jthumb img{width:100%;height:100%;object-fit:cover}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cand{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.cand:hover{border-color:var(--accent)}
.alertbox{border-color:var(--good)}
.nbadge{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--good);color:var(--good-fg);font-size:12px;text-align:center}
.hint{font-size:12px;color:var(--dim)}
@media (max-width:640px){.pick{grid-template-columns:1fr}.pick .poster{max-width:200px}}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){
  .wrap{padding:16px}
  header.top{padding:12px 16px}
  .filters,.listnav{max-width:none}
  .form{grid-template-columns:1fr}
  .film-main h1{font-size:32px}
  .bar{grid-template-columns:100px 1fr 32px}
}
</style>

  <a class="brand" href="#/catalogue">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8A066" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.6 6.2L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.8z"/></svg>
    <span>Ciné Western</span>
  </a>
  <nav class="main" aria-label="Navigation principale">
    <a href="#/catalogue" data-nav="catalogue">Catalogue</a>
    <a href="#/cesoir" data-nav="cesoir">Ce soir<span id="alert-badge" class="nbadge" hidden></span></a>
    <a href="#/collection" data-nav="collection">Ma collection</a>
    <a href="#/journal" data-nav="journal">Journal</a>
    <a href="#/listes" data-nav="listes">Listes et sagas</a>
    <a href="#/top100" data-nav="top100">Top 100</a>
    <a href="#/quiz" data-nav="quiz">Quiz</a>
    <a href="#/stats" data-nav="stats">Statistiques</a>
    <a href="#/reglages" data-nav="reglages">Réglages</a>
  </nav>
  <div class="search">

function mergeFilm(cat, ov) {
  const r = Object.assign({}, cat, ov);
  Object.keys(cat).forEach(k => { if (k !== 'id' && k !== 'synLang' && k !== 'upd' && !USER_KEYS.includes(k) && isBlank(ov[k]) && !isBlank(cat[k])) r[k] = cat[k]; });

  ['th', 'saga', 'fam', 'pd'].forEach(k => { r[k] = cat[k]; });   // champs propres au catalogue

/* Reconstruit la liste complète : catalogue + fiches modifiées/ajoutées − fiches supprimées */
function assemble(over, del) {
  const films = [];
  CAT.forEach(c => { const o = over[c.id]; if (del[c.id] && !(o && (o.upd || 0) > del[c.id])) return; films.push(o ? mergeFilm(c, Object.assign(blankFilm(), o)) : Object.assign({}, c)); });

  films.forEach(migrateFilm);
  return films;
}
/* Anciennes fiches : une date « vu le » devient une séance du journal */
function migrateFilm(f) {
  if (!Array.isArray(f.views)) f.views = [];

  return f;
}
/* ---------- Suivi des modifications (pour la synchronisation) ----------

let PREV = new Map(), PREVL = new Map(), DEL = {}, LDEL = {};

  PREV = new Map(); PREVL = new Map();

  S.lists.forEach(l => PREVL.set(l.id, JSON.stringify(Object.assign({}, l, {upd: 0}))));
}
function computeOver() {
  const now = Date.now(), over = {}, present = new Set();
  S.films.forEach(f => {
    present.add(f.id);
    const j = jsonNoUpd(f);
    if (CAT_JSON.get(f.id) === j && !PREV.has(f.id)) return;
    if (PREV.get(f.id) !== j || DEL[f.id]) { f.upd = now; PREV.set(f.id, j); delete DEL[f.id]; }
    over[f.id] = f;
  });
  PREV.forEach((j, id) => { if (!present.has(id)) { DEL[id] = DEL[id] || now; PREV.delete(id); } });
  CAT.forEach(c => { if (!present.has(c.id) && !DEL[c.id]) DEL[c.id] = now; });
  const lpresent = new Set();
  S.lists.forEach(l => {
    lpresent.add(l.id);
    const j = JSON.stringify(Object.assign({}, l, {upd: 0}));
    if (PREVL.get(l.id) !== j) { l.upd = now; PREVL.set(l.id, j); delete LDEL[l.id]; }
  });
  PREVL.forEach((j, id) => { if (!lpresent.has(id)) { LDEL[id] = LDEL[id] || now; PREVL.delete(id); } });
  return {over, del: DEL, deleted: Object.keys(DEL)};
}

function stateFrom(data) {
  if (!data) return null;
  const lists = cleanLists(data.lists);
  let over = {}, del = {};
  if (data.over && typeof data.over === 'object') {
    over = data.over;
    if (data.del && typeof data.del === 'object') del = Object.assign({}, data.del);
    else (data.deleted || []).forEach(id => { del[id] = 1; });
  } else if (Array.isArray(data.films)) {
    data.films.forEach(f => { if (f && f.id) over[f.id] = f; });
    CAT.forEach(c => { if (/^b\d+$/.test(c.id) && !over[c.id]) del[c.id] = 1; });

  DEL = del; LDEL = Object.assign({}, data.ldel || {});
  const st = {v: 3, films: assemble(over, del), lists, tmdbKey: data.tmdbKey || ''};
  st._over = over;

/* Envoie seulement ce qui a changé : un document par fiche modifiée + un document pour les listes */
async function flushDb() {
  if (dbBusy) { dbAgain = true; return; }
  dbBusy = true;
  const {over, del} = computeOver();
  const jobs = [];
  Object.keys(over).forEach(id => { const j = JSON.stringify(over[id]); if (written.get(id) !== j) jobs.push(() => DB.doc('films/' + id).set(JSON.parse(j)).then(() => written.set(id, j))); });
  [...written.keys()].forEach(id => { if (!over[id]) jobs.push(() => DB.doc('films/' + id).delete().then(() => written.delete(id))); });
  const metaBody = {v: 3, lists: S.lists, del, ldel: LDEL};
  const meta = JSON.stringify(metaBody);
  if (meta !== metaWritten || jobs.length) {
    REV = uid();
    jobs.push(() => DB.doc('meta/main').set(Object.assign(JSON.parse(meta), {rev: REV, at: Date.now()})).then(() => { metaWritten = meta; }));
  }
  let failed = null;
  for (let i = 0; i < jobs.length; i += 8) {
    const res = await Promise.allSettled(jobs.slice(i, i + 8).map(fn => fn()));
    res.forEach(r => { if (r.status === 'rejected') failed = r.reason; });
  }
  storageOk = !failed; dbErr = failed ? (failed.code || 'unavailable') : '';

}

/* --- Petites affiches intégrées (pour la page Claude, qui ne peut pas charger d'images d'autres sites) --- */
const THUMB_BUCKETS = 256;
const thumbWritten = new Map();
const thumbStore = {
  async load() {
    if (MODE !== 'db') return {};
    try {
      const snap = await DB.collection('thumbs').get();
      const out = {}; this.legacy = [];
      snap.docs.forEach(d => { const v = d.data(); if (v && v.t) Object.assign(out, v.t); if (/^p\d+$/.test(d.id)) this.legacy.push(d.id); else thumbWritten.set(d.id, JSON.stringify(v.t || {})); });
      return out;
    } catch (e) { return {}; }
  },
  /* Ajoute ou remplace des affiches ; ne réécrit que les paquets concernés */
  async putMany(map) {
    if (MODE !== 'db') return 0;
    const all = Object.assign({}, THUMBS, map);
    const touched = new Set(Object.keys(map).map(id => hashId(id, THUMB_BUCKETS)));
    if (this.legacy && this.legacy.length) Object.keys(all).forEach(id => touched.add(hashId(id, THUMB_BUCKETS)));
    const buckets = new Map();
    Object.keys(all).forEach(id => { const b = hashId(id, THUMB_BUCKETS); if (touched.has(b)) { if (!buckets.has(b)) buckets.set(b, {}); buckets.get(b)[id] = all[id]; } });
    const jobs = [];
    buckets.forEach((t, b) => { const name = 'b' + String(b).padStart(3, '0'), j = JSON.stringify(t); if (thumbWritten.get(name) !== j) jobs.push(() => DB.doc('thumbs/' + name).set({t}).then(() => thumbWritten.set(name, j))); });
    for (let i = 0; i < jobs.length; i += 6) await Promise.all(jobs.slice(i, i + 6).map(fn => fn()));
    if (this.legacy && this.legacy.length) { for (const id of this.legacy) await DB.doc('thumbs/' + id).delete(); this.legacy = []; }
    return Object.keys(map).length;
  },
  async saveAll(map) { return this.putMany(map); }
};
/* Réduit une affiche en ligne en petite image intégrée (120 px de large) */
function thumbFromUrl(url) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    const timer = setTimeout(() => res(''), 15000);
    im.onload = () => {
      clearTimeout(timer);
      try {
        const w = 120, hgt = Math.round(im.naturalHeight * w / im.naturalWidth) || 180;
        const c = document.createElement('canvas'); c.width = w; c.height = Math.min(hgt, 240);
        c.getContext('2d').drawImage(im, 0, 0, w, hgt);
        res(c.toDataURL('image/jpeg', 0.72));
      } catch (e) { res(''); }
    };
    im.onerror = () => { clearTimeout(timer); res(''); };
    im.src = url;
  });
}

/* --- Affiches Wikipédia : chargées automatiquement, sans clé (application installée) --- */
const WIKI_KEY = 'cinewestern-wiki';
let WIKI = {};               // id -> adresse de la vignette Wikipédia, ou 0 (cherché, rien trouvé)
const WRUN = {active: false, done: 0, total: 0, found: 0};
function loadWiki() { if (IS_WEB) return; try { WIKI = JSON.parse(localStorage.getItem(WIKI_KEY) || '{}') || {}; } catch (e) { WIKI = {}; } }
function saveWiki() { if (IS_WEB) return; try { localStorage.setItem(WIKI_KEY, JSON.stringify(WIKI)); } catch (e) { /* plein : tant pis */ } }
function wikiCandidates(f) {
  const out = [];
  if (f.wiki) { try { out.push(decodeURIComponent(f.wiki.split('/wiki/')[1] || '').replace(/_/g, ' ')); } catch (e) { /* lien mal formé */ } }
  const names = [...new Set([f.originalTitle, f.title].filter(Boolean))];
  const tv = isTV(f);
  names.forEach(n => {
    if (tv) out.push(n + ' (TV series)', f.year ? n + ' (' + f.year + ' TV series)' : '', n + ' (miniseries)');
    else out.push(f.year ? n + ' (' + f.year + ' film)' : '', n + ' (film)');
  });
  return [...new Set(out.filter(Boolean))];
}
/* Interroge Wikipédia par paquets de 50 titres : renvoie {titre demandé: vignette} */
async function wikiThumbs(titles) {
  const u = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=342&redirects=1&titles='
    + encodeURIComponent(titles.join('|'));
  const r = await fetch(u);
  if (!r.ok) throw new Error('Wikipédia indisponible (' + r.status + ')');
  const d = await r.json();
  const q = d.query || {};
  const step = {};
  (q.normalized || []).forEach(x => { step[x.from] = x.to; });
  (q.redirects || []).forEach(x => { step[x.from] = x.to; });
  const thumbs = {};
  Object.values(q.pages || {}).forEach(p => { if (p.thumbnail && p.thumbnail.source) thumbs[p.title] = p.thumbnail.source; });
  const out = {};
  titles.forEach(t => { let k = t, n = 0; while (step[k] && n++ < 3) k = step[k]; if (thumbs[k]) out[t] = thumbs[k]; });
  return out;
}
async function runWiki() {
  if (IS_WEB || WRUN.active) return;
  const todo = S.films.filter(f => WIKI[f.id] === undefined && !IMAGES[f.id] && !f.poster);
  if (!todo.length) return;
  WRUN.active = true; WRUN.done = 0; WRUN.found = 0; WRUN.total = todo.length; paintWikiStatus();
  const cands = new Map(todo.map(f => [f.id, wikiCandidates(f)]));
  let pending = todo.filter(f => cands.get(f.id).length);
  todo.filter(f => !cands.get(f.id).length).forEach(f => { WIKI[f.id] = 0; WRUN.done++; });
  try {
    for (let round = 0; round < 6 && pending.length; round++) {
      const ask = pending.map(f => [f, cands.get(f.id)[round]]).filter(x => x[1]);
      for (let i = 0; i < ask.length; i += 50) {
        const part = ask.slice(i, i + 50);
        const res = await wikiThumbs([...new Set(part.map(x => x[1]))]);
        part.forEach(([f, t]) => { if (res[t]) { WIKI[f.id] = res[t]; WRUN.found++; WRUN.done++; } });
        paintWikiStatus();
        if ((i / 50) % 6 === 5) { saveWiki(); if (route().name === 'catalogue' && !$('#modal-root').innerHTML) paintCatGrid(); }
      }
      pending = pending.filter(f => !WIKI[f.id]);
      pending.filter(f => !cands.get(f.id)[round + 1]).forEach(f => { WIKI[f.id] = 0; WRUN.done++; });
      pending = pending.filter(f => cands.get(f.id)[round + 1]);
    }
    pending.forEach(f => { WIKI[f.id] = 0; });
  } catch (e) {
    toast('Affiches Wikipédia : ' + (/fetch|network/i.test(e.message) ? 'pas de connexion Internet, nouvel essai au prochain démarrage.' : e.message));
  }
  saveWiki(); WRUN.active = false; paintWikiStatus();
  if (route().name === 'catalogue' && !$('#modal-root').innerHTML) paintCatGrid();
  if (WRUN.found) toast(WRUN.found.toLocaleString('fr-FR') + ' affiches ajoutées depuis Wikipédia');
}
function paintWikiStatus() {
  const el = $('#wiki-status'); if (!el) return;
  el.textContent = WRUN.active ? 'Chargement des affiches depuis Wikipédia… ' + Math.round(WRUN.done / Math.max(WRUN.total, 1) * 100) + ' %'

}

/* --- Stockage des photos personnelles --- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('cinewestern', 2);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('images')) db.createObjectStore('images'); if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('images', mode); const out = fn(tx.objectStore('images')); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
  },
  async all() {
    const db = await this.open();
    return new Promise((res, rej) => {
      const out = {}; const req = db.transaction('images').objectStore('images').openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  async getKV(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const req = db.transaction('kv').objectStore('kv').get(k); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
  },
  async putKV(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  del(k) { return this.run('readwrite', st => st.delete(k)); }
};

/* Réduit une image choisie (≈ 400 px de large, JPEG) pour qu'elle reste légère */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) { rej(new Error('Choisis un fichier image (JPEG, PNG, HEIC converti…).')); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const w = Math.min(400, im.naturalWidth), hgt = Math.round(im.naturalHeight * w / im.naturalWidth);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      c.getContext('2d').drawImage(im, 0, 0, w, hgt);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Cette image n'a pas pu être lue. Essaie une photo au format JPEG ou PNG.")); };
    im.src = url;
  });
}

/* --- Recherche automatique des affiches sur TMDB --- */
const RUN = {active: false, stop: false, done: 0, total: 0, found: 0, free: 0, errors: 0, lastError: '', checkFree: false};
/* Offres gratuites en France (gratuit ou avec publicité) d'après TMDB / JustWatch */
async function freeProviders(id, kind) {
  const d = await tmdb('/' + kind + '/' + id + '/watch/providers');
  const fr = d.results && d.results.FR;
  if (!fr) return '';
  return [...new Set([...(fr.free || []), ...(fr.ads || [])].map(x => x.provider_name))].join(', ');
}
async function findPoster(f) {
  const kind = f.tmdbType || (isTV(f) ? 'tv' : 'movie');
  const prev = POSTERS[f.id];
  if (prev && prev.t) return Object.assign({}, prev, RUN.checkFree ? {f: await freeProviders(prev.t, prev.k || kind)} : {});
  if (f.tmdbId) {
    const d = await tmdb('/' + kind + '/' + f.tmdbId, {language: 'fr-FR'});
    const r = d.poster_path ? {p: d.poster_path, t: d.id, k: kind} : 0;
    if (r && RUN.checkFree) r.f = await freeProviders(d.id, kind);
    return r;
  }
  const titles = [...new Set([f.originalTitle, f.title].filter(Boolean))];
  const want = +f.year || 0;
  const yKey = kind === 'tv' ? 'first_air_date_year' : 'year';
  let best = null, bestScore = -1;
  for (const q of titles) {
    for (const withYear of want ? [true, false] : [false]) {
      const res = await tmdb('/search/' + kind, Object.assign({query: q, language: 'fr-FR', include_adult: 'false'}, withYear ? {[yKey]: want} : {}));
      (res.results || []).forEach(r => {
        const y = +((r.release_date || r.first_air_date || '').slice(0, 4)) || 0;
        if (want && y && Math.abs(y - want) > 1) return;
        const names = [r.title, r.original_title, r.name, r.original_name].filter(Boolean).map(tkey);
        const exact = names.includes(tkey(q));
        const western = (r.genre_ids || []).includes(37);
        if (!exact && !western) return;
        const score = (exact ? 4 : 0) + (western ? 3 : 0) + (y === want ? 2 : 0) + (r.poster_path ? 1 : 0);
        if (score > bestScore) { best = r; bestScore = score; }
      });
      if (best && best.poster_path) break;
    }
    if (best && best.poster_path) break;
  }
  const r = best && best.poster_path ? {p: best.poster_path, t: best.id, k: kind} : 0;
  if (r && RUN.checkFree) r.f = await freeProviders(best.id, kind);
  return r;
}
async function runPosters(list) {
  RUN.active = true; RUN.stop = false; RUN.done = 0; RUN.found = 0; RUN.free = 0; RUN.errors = 0; RUN.lastError = '';
  RUN.total = list.length; paintRun();
  let i = 0;
  const worker = async () => {
    while (!RUN.stop && i < list.length) {

        POSTERS[f.id] = r; if (r) RUN.found++; if (r && r.f) RUN.free++;
      } catch (e) {

        if (/clé|joindre/.test(e.message)) RUN.stop = true;
        await new Promise(r => setTimeout(r, 1500));

    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  savePosters(); RUN.active = false; paintRun();
  const freeTxt = RUN.checkFree ? ' · ' + RUN.free + ' regardable' + (RUN.free > 1 ? 's' : '') + ' gratuitement' : '';
  toast((RUN.stop && RUN.done < RUN.total ? 'Recherche arrêtée : ' : 'Terminé : ') + RUN.found + ' affiche' + (RUN.found > 1 ? 's' : '') + ' trouvée' + (RUN.found > 1 ? 's' : '') + ' sur ' + RUN.done + freeTxt + '.');
  if (route().name === 'catalogue') paintCatGrid();
}

/* Fusionne des compléments reçus (sauvegarde ou synchronisation) : on garde l'information la plus complète */
function mergeCaches(c) {

  if (c && c.enr) Object.keys(c.enr).forEach(id => {
    const a = ENR[id] || {}, b = c.enr[id] || {};

    Object.keys(b).forEach(k => { if (k === 'x') return; if (isBlank(m[k]) && !isBlank(b[k])) m[k] = b[k]; });

    const cands = new Map(todo.map(f => [f.id, f.wiki ? [decodeURIComponent((f.wiki.split('/wiki/')[1] || '')).replace(/_/g, ' ')].concat(wikiCandidates(f)) : wikiCandidates(f)]));

/* =========================================================
   Distribution complète (acteurs et actrices)
   - application installée : Wikidata (sans clé), TVmaze pour les séries
   - page Claude : reçue par la synchronisation

const nkey = (s) => norm(String(s || '').replace(/["“”«»][^"“”«»]*["“”«»]/g, ' ')).replace(/[^a-z0-9]/g, '');

  if (f.castFull || !more || !more.length) return base;
  const out = base.map(c => Object.assign({}, c)), idx = new Map(out.map((c, i) => [nkey(c.name), i]));
  more.forEach(([name, role, g, q]) => {

    else { idx.set(k, out.length); out.push({name, role: role || '', g: g || '', q: q || ''}); }

    const r = await fetch(url, {headers: {accept: 'application/sparql-results+json'}});
    if (r.ok) return ((await r.json()).results || {}).bindings || [];
    if (r.status === 429 || r.status >= 500) { await sleepMs(4000 * (k + 1)); continue; }

/* Trouve l'élément Wikidata d'un titre sans page Wikipédia connue (titre + année) */
async function findQid(f) {
  const tries = [];
  if (f.originalTitle) tries.push([f.originalTitle, 'en']);
  if (f.title) tries.push([f.title, /^b\d+$/.test(f.id) ? 'fr' : 'en']);
  for (const [t, lang] of tries) {
    const d = await apiJson('https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=10&language=' + lang + '&uselang=' + lang + '&search=' + encodeURIComponent(t));
    const hit = (d.search || []).find(x => {
      const desc = x.description || '';
      if (!/film|movie|serial|series|série|western|téléfilm|feuilleton/i.test(desc)) return false;
      const ys = yearIn(desc);
      return !f.year || !ys.length || ys.some(y => Math.abs(y - +f.year) <= 1);
    });
    if (hit) return hit.id;
  }
  return '';
}

      const part = gIds.slice(i, i + 60), qs = [...new Set(part.map(id => guess[id]))];
      const rows = await sparql(`SELECT ?film ?cls ?date ?frt ?dur ?imdb ?tmdb ?tmdbtv WHERE { VALUES ?film { ${qs.map(q => 'wd:' + q).join(' ')} }
        OPTIONAL { ?film wdt:P31 ?cls } OPTIONAL { ?film wdt:P577 ?date } OPTIONAL { ?film wdt:P2047 ?dur } OPTIONAL { ?film wdt:P345 ?imdb }
        OPTIONAL { ?film wdt:P4947 ?tmdb } OPTIONAL { ?film wdt:P4983 ?tmdbtv }
        OPTIONAL { ?art schema:about ?film ; schema:isPartOf <https://fr.wikipedia.org/> ; schema:name ?frt } }`);
      const info = {};
      rows.forEach(b => {
        const q = qid(bv(b, 'film')), o = info[q] || (info[q] = {cls: new Set(), years: new Set()});
        if (b.cls) o.cls.add(qid(bv(b, 'cls')));
        if (b.date) o.years.add(+bv(b, 'date').slice(0, 4));
        ['frt', 'dur', 'imdb', 'tmdb', 'tmdbtv'].forEach(k => { if (b[k] && !o[k]) o[k] = bv(b, k); });
      });
      part.forEach(id => {
        const f = byId(id), q = guess[id], o = info[q];
        if (!o || ![...o.cls].some(c => FILM_CLASSES.has(c))) return;
        if (f.year && o.years.size && ![...o.years].some(y => Math.abs(y - +f.year) <= 1)) return;
        qOf[id] = q;
        if (!ENR[id] || ENR[id].x) {   // on complète aussi titre français, durée et identifiants
          const e = {q};
          if (o.frt) e.fr = cleanFrTitle(o.frt);
          const m = Math.round(parseFloat(o.dur)); if (m > 0 && m < 1000) e.rt = m;
          if (o.tmdb) { e.tm = +o.tmdb; e.tk = 'movie'; } else if (o.tmdbtv) { e.tm = +o.tmdbtv; e.tk = 'tv'; }
          if (o.imdb) e.im = o.imdb;
          ENR[id] = e;
        }
      });
      await sleepMs(300);
    }
    CRUN.done = Math.round(todo.length * 0.3); paintWikiStatus();
    // 2. Distribution, rôles et genre : une requête pour 60 titres ; les plus connus d'abord
    const withQ = todo.filter(f => qOf[f.id]);
    for (let i = 0; i < withQ.length; i += 60) {
      const part = withQ.slice(i, i + 60), byQ = {};
      part.forEach(f => { (byQ[qOf[f.id]] = byQ[qOf[f.id]] || []).push(f.id); });
      const rows = await sparql(`SELECT ?film ?actor ?actorLabel ?g ?sl ?roleLabel ?rname WHERE { VALUES ?film { ${Object.keys(byQ).map(q => 'wd:' + q).join(' ')} }
        ?film p:P161 ?st . ?st ps:P161 ?actor .
        OPTIONAL { ?st pq:P453 ?role } OPTIONAL { ?st pq:P4633 ?rname }
        OPTIONAL { ?actor wdt:P21 ?g } OPTIONAL { ?actor wikibase:sitelinks ?sl }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en,mul". } }`);
      const per = {};
      rows.forEach(b => {
        const fq = qid(bv(b, 'film')), aq = qid(bv(b, 'actor')), name = bv(b, 'actorLabel');
        if (!name || /^Q\d+$/.test(name)) return;
        const m = per[fq] || (per[fq] = new Map());
        const role = (bv(b, 'roleLabel') && !/^Q\d+$/.test(bv(b, 'roleLabel')) ? bv(b, 'roleLabel') : '') || bv(b, 'rname');
        const cur = m.get(aq);
        if (!cur) m.set(aq, {name, role, g: genderOf(bv(b, 'g')), sl: +bv(b, 'sl') || 0, q: aq});
        else { if (!cur.role && role) cur.role = role; if (!cur.g) cur.g = genderOf(bv(b, 'g')); }
      });
      Object.keys(byQ).forEach(fq => {
        const list = per[fq] ? [...per[fq].values()].sort((a, b) => b.sl - a.sl || a.name.localeCompare(b.name)).slice(0, 40) : [];
        byQ[fq].forEach(id => { res[id] = list.map(a => [a.name, a.role, a.g, a.q]); done.add(id); });
      });
      CRUN.done = Math.round(todo.length * (0.3 + 0.55 * (i + 60) / Math.max(withQ.length, 1))); paintWikiStatus();
      if ((i / 60) % 10 === 9) { Object.assign(CAST, res); saveCaches(); }
      await sleepMs(400);
    }
    // 3. Séries : distribution de TVmaze quand Wikidata n'a presque rien
    const series = todo.filter(f => isTV(f) && (!res[f.id] || res[f.id].length < 4));
    for (let i = 0; i < series.length; i++) {
      const f = series[i];
      try {
        let cast = null;
        if (EPS[f.id] && EPS[f.id].tv) cast = await apiJson('https://api.tvmaze.com/shows/' + EPS[f.id].tv + '/cast');
        else {
          for (const n of [...new Set([f.originalTitle, f.title].filter(Boolean))]) {
            const show = await apiJson('https://api.tvmaze.com/singlesearch/shows?embed=cast&q=' + encodeURIComponent(n)).catch(() => null);
            if (show && (!f.year || !show.premiered || Math.abs(+show.premiered.slice(0, 4) - +f.year) <= 1) && tkey(show.name) === tkey(n)) { cast = (show._embedded && show._embedded.cast) || []; break; }
          }
        }
        if (cast) {
          const list = res[f.id] ? res[f.id].slice() : [], have = new Set(list.map(a => nkey(a[0])));
          cast.forEach(c => {
            const name = c.person && c.person.name; if (!name || have.has(nkey(name))) return;
            have.add(nkey(name));
            list.push([name, (c.character && c.character.name) || '', c.person.gender === 'Female' ? 'f' : c.person.gender === 'Male' ? 'm' : '', '']);
          });
          res[f.id] = list.slice(0, 40);
        }
        done.add(f.id);
      } catch (e) { /* on réessaiera */ }
      CRUN.done = Math.round(todo.length * (0.85 + 0.15 * (i + 1) / Math.max(series.length, 1))); paintWikiStatus();
      await sleepMs(600);
    }
  } catch (e) { failed = true; }
  Object.assign(CAST, res);
  // Titres sans résultat : on ne recherche plus (sauf « Relancer la recherche »), sauf si le réseau a coupé
  if (!failed) todo.forEach(f => { if (!(f.id in CAST)) CAST[f.id] = []; });
  CRUN.active = false; HAY.clear(); saveCaches(); paintWikiStatus();
  const n = todo.filter(f => CAST[f.id] && CAST[f.id].length).length;
  if (n) toast('Distribution complète ajoutée pour ' + n.toLocaleString('fr-FR') + ' titres');
  if (!$('#modal-root').innerHTML) render();
}

   ========================================================= */
async function tmdb(path, params = {}) {
  if (IS_WEB) throw new Error(WEB_TMDB_MSG);
  const key = (S.tmdbKey || '').trim();
  if (!key) throw new Error('Aucune clé TMDB enregistrée. Ajoute-la dans Réglages.');
  const u = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) u.searchParams.set(k, v); });
  const opt = {headers: {accept: 'application/json'}};
  if (key.length > 40) opt.headers.Authorization = 'Bearer ' + key; else u.searchParams.set('api_key', key);
  let r;
  try { r = await fetch(u, opt); }
  catch (e) { throw new Error('Impossible de joindre TMDB. Vérifie ta connexion Internet.'); }
  if (r.status === 401) throw new Error('TMDB refuse la clé. Vérifie-la dans Réglages.');
  if (r.status === 404) throw new Error('Film introuvable sur TMDB.');
  if (!r.ok) throw new Error('TMDB a répondu avec une erreur (' + r.status + '). Réessaie dans un moment.');
  return r.json();
}
const isTV = (f) => f.type === 'Série' || f.type === 'Mini-série';
const tmdbDetails = (id, kind) => tmdb('/' + (kind === 'tv' ? 'tv' : 'movie') + '/' + id,
  {language: 'fr-FR', append_to_response: 'credits,videos,watch/providers', include_video_language: 'fr,en'});

/* Clé de comparaison de titres (sans accents, ponctuation ni article) */
const tkey = (t) => norm(t).replace(/[’'`]/g, '').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim()
  .replace(/^(the|a|an|le|la|les|l|el|il|lo|un|une|der|die|das)\s+/, '');
let LOCAL_IDX = null;
function findLocal(titles, year) {
  if (!LOCAL_IDX) {
    LOCAL_IDX = new Map();
    S.films.forEach(f => [f.title, f.originalTitle].filter(Boolean).forEach(t => {
      const k = tkey(t); if (!LOCAL_IDX.has(k)) LOCAL_IDX.set(k, []); LOCAL_IDX.get(k).push(f);
    }));
  }
  for (const t of titles.filter(Boolean)) {
    const hit = (LOCAL_IDX.get(tkey(t)) || []).find(f => f.year && year && Math.abs(+f.year - +year) <= 1);
    if (hit) return hit;
  }
  return null;
}
const sameTmdb = (f, id, kind) => f.tmdbId === id && (f.tmdbType || 'movie') === kind;

function fromTmdb(d, kind) {
  const tv = kind === 'tv';
  const crew = (d.credits && d.credits.crew) || [];
  const countries = tv ? (d.origin_country || []).map(c => ({iso_3166_1: c, name: c})) : (d.production_countries || []);
  const genreIds = (d.genres || []).map(g => g.id);
  let sub = 'Non classé';
  if (countries.some(c => c.iso_3166_1 === 'IT')) sub = 'Western spaghetti';
  else if (genreIds.includes(35)) sub = 'Western comique';
  const vids = ((d.videos && d.videos.results) || []).filter(v => v.site === 'YouTube');
  const trailer = vids.find(v => v.type === 'Trailer' && v.iso_639_1 === 'fr') || vids.find(v => v.type === 'Trailer') || vids[0];
  const p = d['watch/providers'] && d['watch/providers'].results && d['watch/providers'].results.FR;
  let providers = '';
  if (p) {
    const part = (label, arr) => (arr && arr.length ? label + ' : ' + arr.map(x => x.provider_name).join(', ') : '');
    providers = [part('Gratuit', p.free), part('Gratuit avec pub', p.ads), part('Abonnement', p.flatrate), part('Location', p.rent), part('Achat', p.buy)].filter(Boolean).join(' · ');
  }
  const title = (tv ? d.name : d.title) || (tv ? d.original_name : d.original_title) || '';
  const orig = tv ? d.original_name : d.original_title;
  const out = {
    tmdbId: d.id, tmdbType: tv ? 'tv' : 'movie', title,
    originalTitle: orig && orig !== title ? orig : '',
    year: ((tv ? d.first_air_date : d.release_date) || '').slice(0, 4),
    director: tv ? (d.created_by || []).map(c => c.name).join(', ') : crew.filter(c => c.job === 'Director').map(c => c.name).join(', '),
    country: countries.map(c => COUNTRY[c.iso_3166_1] || c.name).join(', '), subgenre: sub,
    runtime: (tv ? (d.episode_run_time || [])[0] : d.runtime) || null,
    cast: ((d.credits && d.credits.cast) || []).slice(0, 30).map(c => ({name: c.name, role: c.character || ''})),
    synopsis: d.overview || '', synLang: d.overview ? '' : 'en', poster: d.poster_path ? IMG + 'w342' + d.poster_path : '',
    tmdbNote: d.vote_average ? Math.round(d.vote_average * 10) / 10 : null,
    trailer: trailer ? 'https://www.youtube.com/watch?v=' + trailer.key : '',
    providers: providers, providersLink: p && p.link ? p.link : '',
    freeFR: p ? [...new Set([...(p.free || []), ...(p.ads || [])].map(x => x.provider_name))].join(', ') : ''
  };
  if (tv) {
    out.type = d.type === 'Miniseries' ? 'Mini-série' : 'Série';
    const end = (d.last_air_date || '').slice(0, 4);
    out.endYear = !d.in_production && end && end !== out.year ? end : '';
  }
  return out;
}
/* Ajoute les infos TMDB à une fiche sans effacer ce qui existe ni ce que l'utilisateur a saisi pour lui-même */
function applyTmdb(f, d) {
  Object.keys(d).forEach(k => {
    if (isBlank(d[k])) return;
    if (k === 'subgenre' && f.subgenre && f.subgenre !== 'Non classé') return;
    if (k === 'synLang') return;
    f[k] = d[k];
  });
  if (d.synopsis) f.synLang = '';
  HAY.delete(f.id); LOCAL_IDX = null;
}
async function importTmdb(id, kind) {
  const existing = S.films.find(f => sameTmdb(f, id, kind));
  if (existing) return existing;
  const raw = await tmdbDetails(id, kind);
  const d = fromTmdb(raw, kind);
  const match = findLocal([d.title, d.originalTitle, kind === 'tv' ? raw.original_name : raw.original_title], d.year);
  if (match && !match.tmdbId) { applyTmdb(match, d); save(); return match; }
  const f = Object.assign(blankFilm(), d);
  S.films.push(f); LOCAL_IDX = null; save();
  return f;
}
async function completeFromTmdb(f) {
  const kind = f.tmdbType || (isTV(f) ? 'tv' : 'movie');
  let id = f.tmdbId;
  if (!id) {
    const tries = [f.originalTitle, f.title].filter(Boolean);
    let hit = null;
    for (const q of tries) {
      const res = await tmdb('/search/' + kind, kind === 'tv'
        ? {query: q, first_air_date_year: f.year, language: 'fr-FR', include_adult: 'false'}
        : {query: q, year: f.year, language: 'fr-FR', include_adult: 'false'});
      const list = res.results || [];
      hit = list.find(r => (r.genre_ids || []).includes(37)) || list[0];
      if (hit) break;
    }
    if (!hit) throw new Error('Aucun titre correspondant trouvé sur TMDB. Vérifie le titre, l\'année et le type (film ou série).');
    id = hit.id;
  }
  const other = S.films.find(x => sameTmdb(x, id, kind) && x.id !== f.id);
  if (other) throw new Error('Ce titre est déjà dans ta base sous le nom « ' + other.title + ' ».');
  applyTmdb(f, fromTmdb(await tmdbDetails(id, kind), kind));
  save();
}

  let s = HAY.get(f.id);
  if (s === undefined) { s = norm([f.title, tTitle(f), f.originalTitle, f.director, castOf(f).map(c => c.name).join(' '), f.country, f.ean].join(' ')); HAY.set(f.id, s); }
  return s;
};
const yearsLabel = (f) => (f.endYear && f.endYear !== f.year ? f.year + '–' + f.endYear : (f.year || '?'));
const typeLabel = (t) => (t === 'Film' ? '' : t);

function filteredFilms() {
  const words = norm(UI.q.trim()).split(/\s+/).filter(Boolean);
  const list = S.films.filter(f => {
    if (words.length) { const hay = hayOf(f); if (!words.every(w => hay.includes(w))) return false; }
    if (UI.decades.size && !UI.decades.has(decadeOf(f.year))) return false;
    if (UI.subs.size && !UI.subs.has(f.subgenre)) return false;
    if (UI.types.size && !UI.types.has(f.type || 'Film')) return false;
    if (UI.hideSeen && f.status === 'vu') return false;
    if (UI.ownedOnly && !f.owned) return false;
    if (UI.toWatch && f.status !== 'avoir') return false;
    if (UI.freeOnly && !canWatchFree(f)) return false;
    if (UI.themes.size && !themesOf(f).some(t => UI.themes.has(t))) return false;
    if (UI.family && !famOf(f)) return false;
    if (UI.maxRt && !(runtimeOf(f) && runtimeOf(f) <= UI.maxRt)) return false;
    return true;
  });
  const cmpT = (a, b) => tTitle(a).localeCompare(tTitle(b), 'fr');
  const sorts = {
    year: (a, b) => (+a.year || 9999) - (+b.year || 9999) || cmpT(a, b),
    yearDesc: (a, b) => (+b.year || 0) - (+a.year || 0) || cmpT(a, b),
    title: cmpT,
    added: (a, b) => (b.addedAt || 0) - (a.addedAt || 0) || cmpT(a, b),
    mine: (a, b) => (b.myNote || 0) - (a.myNote || 0) || cmpT(a, b),
    tmdb: (a, b) => (b.tmdbNote || 0) - (a.tmdbNote || 0) || cmpT(a, b)
  };
  return list.sort(sorts[UI.sort] || sorts.yearDesc);
}

function paintEx() {
  const g = $('#ex-grid'); if (!g) return;
  const info = $('#ex-info'), pager = $('#ex-pager');
  if (EX.loading) { info.innerHTML = '<span class="spin"></span> Recherche sur TMDB…'; return; }
  if (EX.error) { info.textContent = ''; g.innerHTML = `<div class="empty"><h2>La recherche n'a pas abouti</h2><p>${h(EX.error)}</p></div>`; pager.innerHTML = ''; return; }
  info.textContent = EX.q.trim()
    ? `Résultats pour « ${EX.q.trim()} » · page ${EX.page} sur ${Math.max(EX.pages, 1)}`
    : `${EX.total.toLocaleString('fr-FR')} ${EX.kind === 'tv' ? 'séries western trouvées' : 'westerns trouvés'} · page ${EX.page} sur ${Math.max(EX.pages, 1)}`;
  g.innerHTML = EX.results.length ? `<div class="grid">${EX.results.map(exCard).join('')}</div>` :
    `<div class="empty"><h2>Aucun résultat</h2><p>Essaie un autre titre, retire le filtre « Westerns uniquement » ou baisse la note minimum.</p></div>`;

     <span class="muted">${EX.page} / ${EX.pages}</span>
     <button type="button" class="btn" data-act="ex-page" data-d="1" ${EX.page >= EX.pages ? 'disabled' : ''}>Page suivante</button>` : '';
}
async function exLoad() {
  EX.loading = true; EX.loaded = true; paintEx();
  try {
    let data;
    if (EX.q.trim()) {
      data = await tmdb('/search/' + EX.kind, {query: EX.q.trim(), language: 'fr-FR', page: EX.page, include_adult: 'false'});
      let res = data.results || [];
      if (EX.only) res = res.filter(r => (r.genre_ids || []).includes(37));
      if (EX.dec) res = res.filter(r => decadeOf((r.release_date || r.first_air_date || '').slice(0, 4)) === +EX.dec);
      if (EX.vote) res = res.filter(r => (r.vote_average || 0) >= EX.vote);
      data.results = res;
    } else {
      const tv = EX.kind === 'tv';
      const dateKey = tv ? 'first_air_date' : 'primary_release_date';
      const p = {with_genres: 37, language: 'fr-FR', sort_by: EX.sort.replace('primary_release_date', dateKey), page: EX.page, include_adult: 'false',
        'vote_count.gte': EX.sort === 'vote_average.desc' ? (tv ? 20 : 100) : (tv ? 1 : 5)};
      if (EX.vote) p['vote_average.gte'] = EX.vote;
      if (EX.dec) { p[dateKey + '.gte'] = EX.dec + '-01-01'; p[dateKey + '.lte'] = (+EX.dec + 9) + '-12-31'; }
      data = await tmdb('/discover/' + EX.kind, p);
    }
    EX.results = data.results || []; EX.total = data.total_results || 0; EX.pages = Math.min(data.total_pages || 0, 500); EX.error = '';
  } catch (e) { EX.error = e.message; EX.results = []; }
  EX.loading = false; paintEx();
}

function closeEditor() { $('#modal-root').innerHTML = ''; editingId = null; if (QUIZ) { QUIZ = null; stopAudio(); render(); } }
function saveEditor() {
  const v = (id) => $(id).value.trim();
  const title = v('#e-title'), year = v('#e-year'), run = v('#e-run'), end = v('#e-end');
  const err = $('#e-err');
  if (!title) { err.textContent = 'Indique au moins le titre.'; $('#e-title').focus(); return; }
  if (year && !/^(18|19|20)\d\d$/.test(year)) { err.textContent = "L'année doit avoir 4 chiffres, par exemple 1966."; $('#e-year').focus(); return; }
  if (end && (!/^(18|19|20)\d\d$/.test(end) || (year && +end < +year))) { err.textContent = "L'année de fin doit avoir 4 chiffres et venir après l'année de début."; $('#e-end').focus(); return; }
  if (v('#e-watch') && !/^https?:\/\//i.test(v('#e-watch'))) { err.textContent = 'Le lien pour regarder doit commencer par https:// (copie-le depuis la barre d\'adresse).'; $('#e-watch').focus(); return; }
  if (run && !/^\d{1,3}$/.test(run)) { err.textContent = 'La durée doit être un nombre de minutes, par exemple 161.'; $('#e-run').focus(); return; }
  const cast = $('#e-cast').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.split(/\s+[—–-]\s+/);
    return {name: m[0].trim(), role: (m.slice(1).join(' - ') || '').trim()};
  });
  const prevCast = editingId ? castOf(byId(editingId)) : [];
  const castSame = editingId && JSON.stringify(cast.map(c => [c.name, c.role])) === JSON.stringify(prevCast.map(c => [c.name, c.role || '']));
  const data = {title, originalTitle: v('#e-orig'), year, director: v('#e-dir'), country: v('#e-country'), subgenre: $('#e-sub').value,
    runtime: run ? +run : null, cast, synopsis: v('#e-syn'), poster: v('#e-poster'), trailer: v('#e-trailer'), watchLink: v('#e-watch'), type: $('#e-type').value, endYear: end};
  if (castSame) delete data.cast; else if (editingId) data.castFull = true;
  let f;
  if (editingId) {
    f = byId(editingId);
    if (data.synopsis === tSyn(f).text && tSyn(f).lang === 'en') data.synopsis = f.synopsis;
    else if (data.synopsis !== f.synopsis) data.synLang = '';
    if (data.title === tTitle(f)) data.title = f.title;
    if (+data.runtime === runtimeOf(f) && !f.runtime) data.runtime = null;
    Object.assign(f, data); HAY.delete(f.id);
  }
  else { f = Object.assign(blankFilm(), data); S.films.push(f); }
  save(); closeEditor();
  toast(editingId ? 'Fiche enregistrée' : '« ' + tTitle(f) + ' » ajouté à ta base');
  if (location.hash === '#/film/' + f.id) render(); else location.hash = '#/film/' + f.id;
}

function exportCsv(all) {
  const cols = ['Titre', 'Titre original', 'Type', 'Année', 'Année de fin', 'Réalisation', 'Pays', 'Sous-genre', 'Durée (min)', 'Statut', 'Possédé', 'Support', 'Ma note (/5)', 'Vu le', 'Note TMDB', 'Regarder gratuitement', 'Listes', 'Acteurs', 'Mes notes'];
  const q = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.join(';')];
  const inList = new Set(S.lists.flatMap(l => l.ids));
  const rows = all ? S.films : S.films.filter(f => f.status || f.owned || f.myNote || f.notes || inList.has(f.id));
  rows.slice().sort((a, b) => a.title.localeCompare(b.title, 'fr')).forEach(f => {
    lines.push([tTitle(f), tOrig(f) || f.originalTitle, f.type || 'Film', f.year, f.endYear, f.director, f.country, f.subgenre, runtimeOf(f) || '',
      f.status === 'vu' ? 'Vu' : f.status === 'avoir' ? 'À voir' : '', f.owned ? 'Oui' : 'Non', f.owned ? f.support : '',
      f.myNote || '', fmtDate(f.watchedDate), fmtNote(f.tmdbNote), [f.watchLink, f.pd ? 'Domaine public' : '', freeOf(f)].filter(Boolean).join(' · '), S.lists.filter(l => l.ids.includes(f.id)).map(l => l.name).join(', '),
      castOf(f).map(c => c.name).join(', '), f.notes].map(q).join(';'));
  });
  if (lines.length === 1) { toast('Ta collection est vide : rien à exporter pour l\'instant.'); return; }
  download((all ? 'cine-western-catalogue-' : 'cine-western-collection-') + today() + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8').then(ok => { if (ok) toast('Fichier Excel (CSV) téléchargé'); });
}
async function download(name, text, type) {
  if (IS_WEB) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast("Le téléchargement n'est pas disponible sur cette page."); return false; }
    try { await dl.save({filename: name, data: text}); return true; }
    catch (e) { if (e && e.code !== 'declined') toast('Téléchargement impossible : ' + (e.message || e.code)); return false; }
  }
  const b = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

function bars(entries, max) {
  if (!entries.length) return '<p class="muted">Pas encore de données.</p>';
  const m = max || Math.max(...entries.map(e => e[1]), 1);
  return `<div class="bars">${entries.map(([k, v]) => `<div class="bar"><span>${h(k)}</span><div class="track"><div class="fill" style="width:${(v / m * 100).toFixed(1)}%"></div></div><span class="v">${v.toLocaleString('fr-FR')}</span></div>`).join('')}</div>`;
}
function countBy(list, fn) {
  const m = new Map();
  list.forEach(f => [].concat(fn(f)).filter(Boolean).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
  return [...m.entries()];
}
function viewStats() {
  const vus = S.films.filter(f => f.status === 'vu');
  const dec = countBy(vus, f => decadeOf(f.year) ? decadeOf(f.year) + 's' : null).sort((a, b) => a[0].localeCompare(b[0]));
  const decAll = countBy(S.films, f => decadeOf(f.year) ? decadeOf(f.year) + 's' : null).sort((a, b) => a[0].localeCompare(b[0]));
  const typeAll = countBy(S.films, f => TYPE_PLURAL[f.type || 'Film'] || f.type).sort((a, b) => b[1] - a[1]);
  const subAll = countBy(S.films, f => f.subgenre).sort((a, b) => b[1] - a[1]);
  const sub = countBy(vus, f => f.subgenre).sort((a, b) => b[1] - a[1]);
  const dirs = countBy(vus, f => (f.director || '').split(/,\s*| et /).map(s => s.trim())).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8);
  const actors = countBy(vus, f => castOf(f).slice(0, 6).map(c => c.name)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8);
  const pct = S.films.length ? Math.round(vus.length / S.films.length * 100) : 0;
  const noted = vus.filter(f => f.myNote);

  const views = allViews(), yr = String(new Date().getFullYear());

  const hours = [...minsBy.entries()].sort((a, b) => a[0].localeCompare(b[0])).slice(-12).map(([y, m]) => [y, Math.round(m / 60)]);
  const withWho = countBy(views, x => x.v.w || null).sort((a, b) => b[1] - a[1]).slice(0, 8);

const sagaOf = (f) => { if (!f.saga) return null; const [name, n] = String(f.saga).split('#'); return {name, n: +n || 0}; };

function sagaFilms(name) {

function journalBlock(f) {

      : '<p class="muted" style="margin:0">Aucune séance enregistrée. Le bouton « Vu » en ajoute une.</p>'}</div>`;
}
function episodesBlock(f) {
  if (!isTV(f)) return '';
  const E = EPS[f.id];
  if (!E) return `<div class="box-l"><h2 class="label">Épisodes</h2>
    <p class="muted" style="margin:0">${IS_WEB ? 'La liste des épisodes se charge dans l\'application installée, puis arrive ici par la synchronisation.' : 'La liste des saisons et épisodes vient de TVmaze (gratuit, sans clé).'}</p>
    ${IS_WEB ? '' : `<div class="row"><button type="button" class="btn small" data-act="eps-load">${ICON.cloud}Charger les épisodes</button></div>`}</div>`;
  const seen = new Set(f.epSeen || []);
  const seasons = new Map();
  E.eps.forEach(e => { if (!seasons.has(e[1])) seasons.set(e[1], []); seasons.get(e[1]).push(e); });
  const tot = E.eps.length, nSeen = E.eps.filter(e => seen.has(e[0])).length, pct = tot ? Math.round(nSeen / tot * 100) : 0;
  return `<div class="box-l"><h2 class="label">Épisodes <span class="lbl-note">(${E.eps.length} épisodes, ${seasons.size} saison${seasons.size > 1 ? 's' : ''}, d'après TVmaze)</span></h2>
    <div class="bar" style="grid-template-columns:1fr auto"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="v">${nSeen} / ${tot} vus</span></div>
    ${[...seasons.entries()].map(([sn, eps]) => {
      const ns = eps.filter(e => seen.has(e[0])).length;
      return `<details class="season"${ns && ns < eps.length ? ' open' : ''}><summary>Saison ${sn} <span class="muted">· ${ns}/${eps.length}</span></summary>
        <div class="row" style="margin:6px 0"><button type="button" class="btn small" data-act="eps-season" data-s="${sn}" data-v="${ns === eps.length ? 0 : 1}">${ns === eps.length ? 'Tout décocher' : 'Toute la saison vue'}</button></div>
        <ul class="eps">${eps.map(e => `<li><label class="check"><input type="checkbox" data-ch="ep" value="${e[0]}" ${seen.has(e[0]) ? 'checked' : ''}><span><b>${e[1]}×${String(e[2]).padStart(2, '0')}</b> ${h(e[3])}</span>${e[4] ? `<span class="n">${fmtDate(e[4])}</span>` : ''}</label></li>`).join('')}</ul></details>`;
    }).join('')}</div>`;
}
/* Tous les épisodes cochés : la série passe en « vu » */
function epsDone(f) {
  const E = EPS[f.id]; if (!E || !E.eps.length) return false;
  const set = new Set(f.epSeen || []);
  if (E.eps.every(e => set.has(e[0])) && f.status !== 'vu') {
    f.status = 'vu'; if (!(f.views || []).length) f.views.push({d: today(), w: '', e: '', n: 0, c: 'Dernier épisode'}); f.watchedDate = lastView(f);
    toast('Série terminée : marquée « Vu »'); return true;
  }
  return false;
}
/* Films proches : mêmes acteurs, réalisateur, saga, thèmes, sous-genre, époque */
function similarScores(f, out) {
  const cast = new Set(castOf(f).slice(0, 8).map(c => nkey(c.name))), dirs = new Set(splitNames(f.director)), th = new Set(themesOf(f)), sg = sagaOf(f);
  const y = +f.year || 0;
  S.films.forEach(g => {
    if (g.id === f.id) return;
    let s = 0, k = 0;
    castOf(g).slice(0, 8).forEach(c => { if (cast.has(nkey(c.name)) && k < 3) { s += 3; k++; } });
    if (dirs.size && splitNames(g.director).some(d => dirs.has(d))) s += 5;
    if (sg && sagaOf(g) && sagaOf(g).name === sg.name) s += 6;
    themesOf(g).forEach(t => { if (th.has(t)) s += 2; });
    if (s === 0) return;
    if (g.subgenre === f.subgenre) s += 1.5;
    const gy = +g.year || 0; if (y && gy) s += Math.abs(gy - y) <= 5 ? 1 : Math.abs(gy - y) <= 12 ? 0.5 : 0;
    out.set(g.id, (out.get(g.id) || 0) + s);
  });
  return out;
}
function similarTo(f, n) {
  const sc = similarScores(f, new Map());
  return [...sc.entries()].filter(([id, s]) => s >= 4).sort((a, b) => b[1] - a[1]).slice(0, n || 8).map(([id]) => byId(id)).filter(Boolean);
}
function similarBlock(f) {
  const list = similarTo(f, 6);
  if (!list.length) return '';
  return `<div class="box-l"><h2 class="label">Si tu as aimé ce titre</h2><div class="grid small-grid">${list.map(card).join('')}</div></div>`;
}

function castBlock(f) {
  const list = castOf(f);
  if (!list.length) return '';
  const nf = list.filter(c => c.g === 'f').length, nm = list.filter(c => c.g === 'm').length;
  const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');
  const count = nf || nm ? [nm ? plural(nm, 'acteur') : '', nf ? plural(nf, 'actrice') : ''].filter(Boolean).join(' et ') + (nf + nm < list.length ? ' · ' + list.length + ' en tout' : '') : plural(list.length, 'nom');
  const fromWd = !f.castFull && CAST[f.id] && CAST[f.id].length;
  const one = (c) => `<a class="person" href="${personHref(c.name)}" title="Tous ses westerns"><span class="ini${c.g === 'f' ? ' f' : ''}">${h(initials(c.name))}</span><span><b>${h(c.name)}</b>${c.role ? `<i>${h(c.role)}</i>` : ''}</span></a>`;
  const first = list.slice(0, 12), rest = list.slice(12);
  return `<div style="display:flex;flex-direction:column;gap:10px"><h2 class="label">Distribution <span class="lbl-note">${count}${fromWd ? ' · complétée automatiquement' : ''}</span></h2>
    <div class="cast">${first.map(one).join('')}</div>
    ${rest.length ? `<details class="more-cast"><summary>Voir les ${rest.length} autres</summary><div class="cast">${rest.map(one).join('')}</div></details>` : ''}
    ${!fromWd && !f.castFull && !IS_WEB && (f.id in CAST) ? '<p class="hint" style="margin:0">Distribution complète introuvable sur Wikidata : tu peux la saisir avec « Modifier la fiche ».</p>' : ''}
    ${!fromWd && !(f.id in CAST) && IS_WEB ? '<p class="hint" style="margin:0">La distribution complète arrive depuis l\'application installée par la synchronisation.</p>' : ''}
  </div>`;
}

/* =========================================================
   Musique, bande-annonce et quiz
   - Wikidata (sans clé) : compositeur, bande-annonce YouTube, lieux, œuvre d'origine
   - iTunes (sans clé, extraits légaux de 30 s) : musique du film
   - Quiz : construit à partir de la fiche ; sur la page Claude, Claude peut en rédiger un sur l'histoire
   ========================================================= */
let EXT = {};   // id -> {mu: [compositeurs], yt: [[vidéo, 1 = bande-annonce]], fl: [lieux de tournage], nl: [lieux de l'action], ba: [d'après]}
let MUS = {};   // id -> {al, ar, u, tr: [[morceau, extrait]]} ; {} = rien trouvé
let QZ = {};    // id -> {by: 'claude', at, q: [{q, c: [4 réponses], a, e}]}
const XRUN = {active: false, done: 0, total: 0};
const MRUN = {active: false, done: 0, total: 0, stop: false};
const XCACHES = [
  {coll: 'ext', pre: 'x', get: () => EXT, set: (v) => { EXT = v; }},
  {coll: 'mus', pre: 'm', get: () => MUS, set: (v) => { MUS = v; }},
  {coll: 'quiz', pre: 'q', get: () => QZ, set: (v) => { QZ = v; }}
];
async function loadXCaches() {
  for (const c of XCACHES) {
    try {
      if (MODE === 'db') {
        const snap = await DB.collection(c.coll).get(), o = {};
        snap.docs.forEach(d => { const v = JSON.parse(JSON.stringify(d.data() || {})); enrWritten.set(c.coll + ':' + d.id, JSON.stringify(v.c || {})); Object.assign(o, v.c || {}); });
        c.set(o);
      } else if (!IS_WEB) c.set((await IDB.getKV(c.coll)) || {});
    } catch (e) { /* vide */ }
  }
}
function xSaveJobs(jobs) {
  XCACHES.forEach(c => {
    const map = c.get(), buckets = Array.from({length: ENR_BUCKETS}, () => ({}));
    Object.keys(map).forEach(id => { buckets[hashId(id, ENR_BUCKETS)][id] = map[id]; });
    buckets.forEach((b, i) => {
      const name = c.pre + String(i).padStart(2, '0'), j = JSON.stringify(b), key = c.coll + ':' + name;
      if (Object.keys(b).length && enrWritten.get(key) !== j) jobs.push(() => DB.doc(c.coll + '/' + name).set({c: b}).then(() => enrWritten.set(key, j)));
    });
  });
}
async function xSaveLocal() { for (const c of XCACHES) await IDB.putKV(c.coll, c.get()); }
function mergeXCaches(c) {
  let changed = false;
  if (c && c.ext) Object.keys(c.ext).forEach(id => { const a = EXT[id], b = c.ext[id]; if (b && (!a || Object.keys(b).length > Object.keys(a).length)) { EXT[id] = b; changed = true; } });
  if (c && c.mus) Object.keys(c.mus).forEach(id => { const a = MUS[id], b = c.mus[id]; if (b && (!a || ((b.tr || []).length > (a.tr || []).length))) { MUS[id] = b; changed = true; } });
  if (c && c.quiz) Object.keys(c.quiz).forEach(id => { const a = QZ[id], b = c.quiz[id]; if (b && b.q && (!a || (b.at || 0) > (a.at || 0))) { QZ[id] = b; changed = true; } });
  return changed;
}

/* --- Wikidata : compositeur, bande-annonce, lieux, œuvre d'origine --- */
async function runExtras() {
  if (IS_WEB || XRUN.active || ERUN.active || CRUN.active) return;
  const todo = S.films.filter(f => ENR[f.id] && ENR[f.id].q && !(f.id in EXT));
  if (!todo.length) return;
  XRUN.active = true; XRUN.done = 0; XRUN.total = todo.length; paintWikiStatus();
  const res = {};
  let failed = false;
  try {
    for (let i = 0; i < todo.length; i += 50) {
      const part = todo.slice(i, i + 50), byQ = {};
      part.forEach(f => { (byQ[ENR[f.id].q] = byQ[ENR[f.id].q] || []).push(f.id); });
      const rows = await sparql(`SELECT ?film (GROUP_CONCAT(DISTINCT ?muL; separator="|") AS ?mu) (GROUP_CONCAT(DISTINCT ?flL; separator="|") AS ?fl)
        (GROUP_CONCAT(DISTINCT ?nlL; separator="|") AS ?nl) (GROUP_CONCAT(DISTINCT ?baL; separator="|") AS ?ba) (GROUP_CONCAT(DISTINCT ?ytv; separator="|") AS ?yt) WHERE {
        VALUES ?film { ${Object.keys(byQ).map(q => 'wd:' + q).join(' ')} }
        OPTIONAL { ?film wdt:P86 ?mus } OPTIONAL { ?film wdt:P915 ?flq } OPTIONAL { ?film wdt:P840 ?nlq } OPTIONAL { ?film wdt:P144 ?baq }
        OPTIONAL { ?film p:P1651 ?yst . ?yst ps:P1651 ?ytid . OPTIONAL { ?yst pq:P3831 ?yrole } BIND(CONCAT(?ytid, IF(BOUND(?yrole) && ?yrole = wd:Q622550, "~1", "~0")) AS ?ytv) }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en,mul". ?mus rdfs:label ?muL . ?flq rdfs:label ?flL . ?nlq rdfs:label ?nlL . ?baq rdfs:label ?baL . }
      } GROUP BY ?film`);
      const got = {};
      rows.forEach(b => {
        const q = qid(bv(b, 'film')), split = (k) => bv(b, k).split('|').map(x => x.trim()).filter(x => x && !/^Q\d+$/.test(x));
        const e = {};
        const mu = split('mu'), fl = split('fl'), nl = split('nl'), ba = split('ba');
        const yt = bv(b, 'yt').split('|').filter(Boolean).map(x => { const [v, t] = x.split('~'); return [v, t === '1' ? 1 : 0]; }).sort((a, c) => c[1] - a[1]);
        if (mu.length) e.mu = mu.slice(0, 3);
        if (fl.length) e.fl = fl.slice(0, 4);
        if (nl.length) e.nl = nl.slice(0, 3);
        if (ba.length) e.ba = ba.slice(0, 2);
        if (yt.length) e.yt = yt.slice(0, 3);
        got[q] = e;
      });
      Object.keys(byQ).forEach(q => byQ[q].forEach(id => { res[id] = got[q] || {}; }));
      XRUN.done = Math.min(todo.length, i + 50); paintWikiStatus();
      if ((i / 50) % 10 === 9) { Object.assign(EXT, res); saveCaches(); }
      await sleepMs(400);
    }
  } catch (e) { failed = true; }
  Object.assign(EXT, res);
  if (!failed) todo.forEach(f => { if (!(f.id in EXT)) EXT[f.id] = {}; });
  XRUN.active = false; saveCaches(); paintWikiStatus();
  if (route().name === 'film' && !$('#modal-root').innerHTML) render();
}

/* --- Musique : extraits iTunes (30 secondes, légaux et gratuits) --- */
let itunesLast = 0;
async function itunes(path) {
  const wait = itunesLast + 3200 - Date.now();   // iTunes accepte une vingtaine de demandes par minute
  if (wait > 0) await sleepMs(wait);
  itunesLast = Date.now();
  const url = 'https://itunes.apple.com/' + path;
  return IS_DESKTOP ? window.cwDesktop.fetchJson(url) : apiJson(url);
}
const OST_RE = /soundtrack|bande originale|original (motion )?picture|o\.?\s?s\.?\s?t\b|\bscore\b|colonna sonora|musique du film|musiques? de films?|original music|from the (motion )?picture|\bb\.?o\.?f\b/i;
function lastName(n) { const p = String(n || '').trim().split(/\s+/); return tkey(p[p.length - 1] || ''); }
async function findMusic(f) {
  if (IS_WEB) throw new Error('Les extraits se cherchent dans l\'application installée, puis arrivent ici par la synchronisation.');
  const names = [...new Set([f.originalTitle, f.title, tTitle(f)].filter(Boolean))];
  const comp = ((EXT[f.id] && EXT[f.id].mu) || [])[0] || '';
  const terms = [];
  names.forEach(n => { if (comp) terms.push(n + ' ' + comp); terms.push(n + ' soundtrack'); });
  let album = null;
  for (const t of [...new Set(terms)].slice(0, 4)) {
    const d = await itunes('search?media=music&entity=album&limit=20&country=FR&term=' + encodeURIComponent(t));
    album = (d.results || []).find(a => {
      const name = tkey(a.collectionName || ''), art = tkey(a.artistName || '');
      if (!names.some(n => tkey(n).length > 2 && name.includes(tkey(n)))) return false;
      const y = +String(a.releaseDate || '').slice(0, 4);
      if (f.year && y && y < +f.year - 1) return false;
      return OST_RE.test(a.collectionName || '') || (comp && art.includes(lastName(comp)));
    });
    if (album) break;
  }
  if (!album) { MUS[f.id] = {}; saveCaches(); return MUS[f.id]; }
  const d = await itunes('lookup?entity=song&limit=40&country=FR&id=' + album.collectionId);
  const songs = (d.results || []).filter(x => x.wrapperType === 'track' && x.previewUrl);
  const main = (s) => (/main title|theme|thème|générique|titres?|opening|prologue/i.test(s.trackName || '') || names.some(n => tkey(s.trackName || '').includes(tkey(n))) ? 0 : 1);
  songs.sort((a, b) => main(a) - main(b) || (a.trackNumber || 0) - (b.trackNumber || 0));
  MUS[f.id] = {al: album.collectionName || '', ar: album.artistName || '', u: album.collectionViewUrl || '', tr: songs.slice(0, 8).map(s => [s.trackName || 'Morceau', s.previewUrl])};
  saveCaches();
  return MUS[f.id];
}
/* Prépare des extraits pour le quiz musical (films vus d'abord, puis le Top 100), sans gêner le reste */
async function runMusicPool(max) {
  if (IS_WEB || MRUN.active) return;
  const want = S.films.filter(f => f.status === 'vu').concat(TOP100.map(byId).filter(Boolean));
  const todo = [...new Set(want)].filter(f => !(f.id in MUS)).slice(0, max || 60);
  if (!todo.length) return;
  MRUN.active = true; MRUN.stop = false; MRUN.done = 0; MRUN.total = todo.length; paintMusicRun();
  for (const f of todo) {
    if (MRUN.stop) break;
    try { await findMusic(f); } catch (e) { if (!navigator.onLine) break; }

}
function paintMusicRun() {
  const el = $('#mus-run'); if (!el) return;
  el.innerHTML = MRUN.active ? `<span class="spin"></span> Recherche des extraits : ${MRUN.done} / ${MRUN.total} <button type="button" class="btn small" data-act="mus-stop">Arrêter</button>` : '';

/* --- Lecteur audio (un seul à la fois) --- */
const PLAYER = {audio: null, key: '', onEnd: null};
function playAudio(url, key) {
  if (!PLAYER.audio) {
    PLAYER.audio = new Audio();
    PLAYER.audio.addEventListener('ended', () => { PLAYER.key = ''; paintPlayButtons(); });
    PLAYER.audio.addEventListener('error', () => {
      if (!PLAYER.key) return;
      PLAYER.key = ''; paintPlayButtons();
      toast(IS_WEB ? 'Cette page ne peut pas lire les extraits : écoute-les dans l\'application installée ou avec le lien Apple Music.' : 'Extrait illisible pour le moment (connexion Internet ?).');
    });
  }
  if (PLAYER.key === key && !PLAYER.audio.paused) { PLAYER.audio.pause(); PLAYER.key = ''; paintPlayButtons(); return; }
  PLAYER.key = key; PLAYER.audio.src = url; PLAYER.audio.currentTime = 0;
  PLAYER.audio.play().catch(() => {});
  paintPlayButtons();
}
function stopAudio() { if (PLAYER.audio) { PLAYER.audio.pause(); } PLAYER.key = ''; paintPlayButtons(); }
function paintPlayButtons() {
  document.querySelectorAll('[data-play-key]').forEach(b => {
    const on = b.dataset.playKey === PLAYER.key;
    b.setAttribute('aria-pressed', on); b.classList.toggle('on', on);
    const lbl = b.querySelector('.pl'); if (lbl) lbl.textContent = on ? 'Pause' : 'Écouter';
  });
}
